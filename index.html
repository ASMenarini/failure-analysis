text":"a 03/07/25 Da verifica sui tolti d'opera  e quelli presenti a MAG  dimensionalmente risultano OK, In verifica ulteriori controlli per eventuali interferenze con altri componenti del motore compreso allineamento. 03/07/25 identificato nuovo fornitore (FAB4HOSE), per richiesta eventuale campionatura.\r\nRif codici  - D024985 - 0102893 - 0102892 - D052893 - 0098983\r\nTK 3665","action":"","owner":"","due":"","status":"Nota storica","parts":[],"attachments":[]},{"id":"note-1911","date":"2025-10-21","text":"verifiche da parte R&D (Alfano) su nuovo fornitore e caratteristiche del prodotto - in attesa dime da tempi e metodi","action":"","owner":"","due":"","status":"Nota storica","parts":[],"attachments":[]},{"id":"note-1913","date":"2025-10-27","text":"Il tema della rottura manicotti è ufficialmente in carico ad R&D che si sta muovendo per avere una campionatura da FAB4HOSE.\r\nDa una prima analisi del fornitore di cui sopra, sembra che la scarsa durata non sia da imputare al nr delle tele dei manicotti che ci fornisce FIMO, ma le maglie della trama non sufficientemente fitta; FAB4HOSE sarebbe in grado di darci prodotti più performanti e molto probabilmente anche più convenienti in termini di costi.","action":"","owner":"","due":"","status":"Nota storica","parts":[],"attachments":[]},{"id":"note-1922","date":"2025-10-29","text":"Si riporta mail di Parisi (29/10/25)\r\nBuongiorno,\r\nal momento non sono stati definiti accordi vincolanti né formalizzati ordini d’acquisto: siamo ancora nella fase interlocutoria.\r\n\r\nAlla luce dell’insostenibilità della sostituzione a caduta con i manicotti Fimo aggravata dai lunghi lead time sul prodotto siliconico da loro proposto abbiamo deciso di anticipare i tempi come service, per garantire il miglior supporto possibile al Field.\r\nIn sintesi, ho richiesto uno studio di fattibilità per il miglioramento del prodotto siliconico, che il fornitore Fab4House ha confermato di poter effettuare,  richiedendo contestualmente una proposta commerciale.","action":"","owner":"","due":"","status":"Nota storica","parts":[],"attachments":[]},{"id":"note-1924","date":"2025-11-05","text":"Oggi ci sarà una riunione con FIMO che si è resa disponibile ad affrontare il tema rotture grazie all'intervento di ACQ (Bettini) che nel mentre affrontava temi di riduzione costi ha introdotto il tema rotture - tolti d'opera inviati a Flumeri (Giulio) sono da spedire a Fimo c.a. Fontana - richiesti test a FIMO (erano stati fatti solo ad inizio produzione molti anni fa)","action":"","owner":"","due":"","status":"Nota storica","parts":[],"attachments":[]},{"id":"note-1933","date":"2025-11-07","text":"in attesa di verifca allineamenti e criteri di verifica da tempi e metodi (in carico a QUA)","action":"","owner":"","due":"","status":"Nota storica","parts":[],"attachments":[]},{"id":"note-1937","date":"2025-11-19","text":"FIMO ha ripetuto una prova di scoppio (15bar) che però non risponde ai test richiesti dalla normativa - si allega minuta riunione interna con QUA/R&D/Tempi & Metodi sul tema - vedasi minuta allegata","action":"","owner":"","due":"","status":"Nota storica","parts":[],"attachments":[{"id":"legacy-note-1937-1","name":"Minuta call Allineamento interno _Manicotti_.msg#","type":"","dataUrl":"","legacyPath":"N:\\SQL\\Discussione anomalie in Esercizio - CPE\\Archivio Schede\\Y - Allegati Schede\\Scheda 294_Rottura manicotti acqua\\Minuta call Allineamento interno _Manicotti_.msg#N:\\SQL\\Discussione anomalie in Esercizio - CPE\\Archivio Schede\\Y - Allegati Schede\\Scheda 294_Rottura manicotti acqua\\Minuta call Allineamento interno _Manicotti_.msg#"}]},{"id":"note-1939","date":"2025-11-28","text":"Ricevuti suggerimenti da R&D per implementazione calibri di controllo deformazione manicotti","action":"","owner":"","due":"","status":"Nota storica","parts":[],"attachments":[]},{"id":"note-1942","date":"2025-12-19","text":"suggerimento R&D su realizzazione calibri di controllo condivisi con tempi e metodi","action":" freni?\r\n\r\nPerché la spia non si deve accendere a PASTIGLIA USURA 100% ma a pastiglia usura almeno all’85% per permettere al cliente di organizzare il fermo veicolo nello spazio temporale di un paio di migliaio di   kilometri e   sostituire i ferodi senza distruggere dischi e pinze.","action":"","owner":"","due":"","status":"Nota storica","parts":[],"attachments":[]}],"deletedAt":null,"legacy":{"claims":"0","family":"","range":"","causalPn":"","plant":"","cn":"","cutIn":"","causeOrigin":"contatore PREUSURA FRENI e ERRORE USURA FRENI a 358 eventi!!!!","selectedSrmCd":"False","reopenDate":""}},{"id":"db-297-31","sheet":"297","title":"Infiltrazioni PDU pantografo","status":"suspended","date":"2025-09-09","models":["CityMood ELE NA"],"entity":"","category":"SERVICE","description":"Infiltrazioni PDU pantografo - anomalia sistema isolamento (2 bus su 3)","parts":[],"attachments":[{"id":"legacy-img-297","name":"infiltrazione PDU.bmp.jpg","type":"image/legacy","dataUrl":"","legacyPath":"N:\\Aftersales\\001_Database\\FAILURE ANALISYS\\Immagini x Failure analisys\\infiltrazione PDU.bmp.jpg"}],"frequencyCases":null,"frequencyScoreStored":1,"safety":10,"sales":3,"warrantyCost":null,"warrantyScoreStored":3,"urgency":10,"ageScore":12,"bonus":30,"bonusReason":"","storedScore":69,"currentAction":{"text":"- verifica sequenza serraggio coperchio\r\n- applicazione sigillante tra coperchio e scatola","owner":"","due":"","status":"In attesa"},"solution":{"text":"","parts":[],"attachments":[{"id":"legacy-s-297-1","name":"Scheda 297 Infiltrazione PDU.pptx#","type":"","dataUrl":"","legacyPath":"N:\\SQL\\Discussione anomalie in Esercizio - CPE\\Archivio Schede\\Y - Schede\\Scheda 297 Infiltrazione PDU.pptx#N:\\SQL\\Discussione anomalie in Esercizio - CPE\\Archivio Schede\\Y - Schede\\Scheda 297 Infiltrazione PDU.pptx#"}]},"updates":[{"id":"note-1898","date":"2025-09-11","text":"A seguito di sigillatura supplementare tra coperchio e scatola non ha manifestato difetti dopo una giornata di let state=load(); let currentView='agenda'; let currentCaseId=null;
function load(){try{const x=JSON.parse(localStorage.getItem(STORE_KEY))||structuredClone(sample);x.agendaIds=Array.isArray(x.agendaIds)?x.agendaIds:[];x.meetings=Array.isArray(x.meetings)?x.meetings:[];return x}catch(e){const x=structuredClone(sample);x.agendaIds=[];x.meetings=[];return x}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state)); refreshCounts()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(d){if(!d)return '—'; const x=new Date(d+'T00:00:00'); return isNaN(x)?d:x.toLocaleDateString('it-IT')}
function freqScore(n){n=Number(n)||0; if(n<5)return 1;if(n<=10)return 2;if(n<=15)return 3;if(n<=20)return 4;if(n<=25)return 5;if(n<=30)return 6;if(n<=35)return 7;if(n<=40)return 8;if(n<=45)return 9;return 10}
function warrantyScore(v){v=Number(v)||0;if(v<500)return 1;if(v<=2000)return 2;if(v<=5000)return 3;if(v<=10000)return 5;if(v<=15000)return 6;if(v<=30000)return 8;return 10}
function ageScoreFromDate(d){if(!d)return 0;const start=new Date(d+'T00:00:00');const now=new Date();const days=Math.max(0,Math.floor((now-start)/86400000));return Math.max(0,Math.round(days/30))}
function total(c){if(c.storedScore!==undefined&&c.storedScore!==null)return Number(c.storedScore)||0;const fs=c.frequencyScoreStored??freqScore(c.frequencyCases);const ws=c.warrantyScoreStored??warrantyScore(c.warrantyCost);const age=c.ageScore??ageScoreFromDate(c.date);return Number(fs||0)+Number(c.safety||0)+Number(c.sales||0)+Number(ws||0)+Number(c.urgency||0)+Number(age||0)+Number(c.bonus||0)}
function activeCases(){return state.cases.filter(c=>!c.deletedAt)}
function trashedCases(){return state.cases.filter(c=>c.deletedAt)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function agendaCases(){const ids=new Set(state.agendaIds||[]);return activeCases().filter(c=>ids.has(c.id)).sort((a,b)=>total(b)-total(a)||String(b.sheet).localeCompare(String(a.sheet),undefined,{numeric:true}))}
function toggleAgenda(id,on){state.agendaIds=Array.isArray(state.agendaIds)?state.agendaIds:[];if(on){if(!state.agendaIds.includes(id))state.agendaIds.push(id)}else state.agendaIds=state.agendaIds.filter(x=>x!==id);save();if(currentCaseId)renderCase(currentCaseId);else render()}
function refreshCounts(){const a=activeCases();const o=a.filter(c=>c.status==='open').length,sp=a.filter(c=>c.status==='suspended').length,cl=a.filter(c=>c.status==='closed').length;document.getElementById('navAgenda').textContent=agendaCases().length;document.getElementById('navAll').textContent=a.length;document.getElementById('navOpen').textContent=o;document.getElementById('navSuspended').textContent=sp;document.getElementById('navClosed').textContent=cl;document.getElementById('navTrash').textContent=trashedCases().length;document.getElementById('navActions').textContent=a.filter(c=>c.currentAction&&c.currentAction.text&&c.currentAction.status!=='Chiusa').length}
function setView(v){currentView=v;currentCaseId=null;document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));render()}
function statusLabel(s){return s==='open'?'Aperto':s==='suspended'?'Sospeso':'Risolto'}
function statusClass(s){return s==='open'?'open':s==='suspended'?'suspended':'closed'}
function scoreClass(v){v=Number(v)||0;return v>=60?'score-high':v>=40?'score-mid':'score-low'}
function render(){if(currentCaseId){renderCase(currentCaseId);return} if(['agenda','cases','open','suspended','closed'].includes(currentView))renderList(); else if(currentView==='actions')renderActions(); else if(currentView==='meetings')renderMeetings(); else renderTrash();}

function categoryLabel(v){
  const s=String(v||'').trim().toLowerCase();
  if(s==='riparativa') return 'Riparativa';
  if(s==='service') return 'Service';
  return '';
}
function ensureSolution(c){
  c.solution=c.solution||{text:'',cid:'',cutIn:'',parts:[],attachments:[]};
  c.solution.parts=Array.isArray(c.solution.parts)?c.solution.parts:[];
  c.solution.attachments=Array.isArray(c.solution.attachments)?c.solution.attachments:[];
  if(c.solution.cid===undefined || c.solution.cid===null) c.solution.cid=c.legacy?.cn||'';
  if(c.solution.cutIn===undefined || c.solution.cutIn===null) c.solution.cutIn=c.legacy?.cutIn||'';
  return c.solution;
}

 const titles={agenda:['Agenda riunione','Casi selezionati per la prossima Failure Analysis, indipendentemente dallo stato'],cases:['Archivio casi','Tutti i casi, compresi sospesi e risolti'],open:['Casi aperti','Problematiche attualmente aperte'],suspended:['Casi sospesi','Problematiche temporaneamente sospese'],closed:['Casi risolti','Archivio delle problematiche chiuse / risolte']};

function cloneForSnapshot(x){return JSON.parse(JSON.stringify(x))}
function createAgendaSnapshot(){
 const cs=agendaCases();
 if(!cs.length){alert('Seleziona almeno un caso per l’agenda.');return}
 const d=new Date().toISOString().slice(0,10);
 const snap={id:crypto.randomUUID(),date:d,createdAt:new Date().toISOString(),cases:cloneForSnapshot(cs)};
 state.meetings.push(snap);save();toast('Snapshot agenda salvato in Riunioni');
}
async function imgSize(data){return new Promise(res=>{const im=new Image();im.onload=()=>res({w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>res({w:1,h:1});im.src=data})}
async function addContain(slide,data,x,y,w,h){const d=await imgSize(data);const r=Math.min(w/d.w,h/d.h),iw=d.w*r,ih=d.h*r;slide.addImage({data,x:x+(w-iw)/2,y:y+(h-ih)/2,w:iw,h:ih})}
function pptText(s){return String(s||'').replace(/\s+/g,' ').trim()}
function allCaseImages(c){
 const imgs=[];
 const push=(a,section,label,date)=>{
   if(a&&a.dataUrl&&String(a.type||'').startsWith('image/')) imgs.push({dataUrl:a.dataUrl,name:a.name||'',section,label:label||'',date:date||''});
 };
 (c.attachments||[]).forEach(a=>push(a,'ANOMALIA','',c.date));
 (c.updates||[]).forEach(u=>(u.attachments||[]).forEach(a=>push(a,'RIUNIONE',u.text||'',u.date)));
 (c.solution?.attachments||[]).forEach(a=>push(a,'SOLUZIONE','',c.solution?.date||''));
 return imgs;
}
function historyChunks(c,maxPerSlide=5){
 const hist=(c.updates||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
 const chunks=[];for(let i=0;i<hist.length;i+=maxPerSlide)chunks.push(hist.slice(i,i+maxPerSlide));return chunks;
}
async function exportAgendaPptx(cases,dateOverride){
 if(!cases||!cases.length){alert('L’agenda non contiene casi da esportare.');return}
 if(typeof PptxGenJS==='undefined'){alert('Il modulo PowerPoint non è stato caricato. Verifica la connessione Internet e riprova.');return}
 const pptx=new PptxGenJS();pptx.layout='LAYOUT_WIDE';pptx.author='MENARINI';pptx.subject='Failure Analysis';pptx.title='Failure Analysis';pptx.company='MENARINI';pptx.lang='it-IT';pptx.theme={headFontFace:'Aptos Display',bodyFontFace:'Aptos',lang:'it-IT'};
 const d=dateOverride||new Date().toISOString().slice(0,10);const dIt=fmtDate(d);
 let slide=pptx.addSlide();slide.addImage({data:MENARINI_COVER,x:0,y:0,w:13.333,h:7.5});
 slide.addText('FAILURE ANALYSIS',{x:.65,y:.55,w:5.8,h:.45,fontFace:'Aptos Display',fontSize:25,bold:true,color:'FFFFFF',margin:0});
 slide.addText(dIt,{x:.72,y:6.92,w:2.3,h:.25,fontFace:'Aptos',fontSize:11,color:'FFFFFF',margin:0});
 let page=2;

 for(let idx=0;idx<cases.length;idx++){
   const c=cases[idx];
   const imgs=allCaseImages(c);

   // MAIN CASE SLIDE
   slide=pptx.addSlide();slide.addImage({data:MENARINI_CONTENT,x:0,y:0,w:13.333,h:7.5});
   slide.addText(`Scheda ${pptText(c.sheet)} — ${pptText(c.title)}`,{x:.7,y:.48,w:11.7,h:.48,fontFace:'Aptos Display',fontSize:22,bold:true,color:'19324D',margin:0,fit:'shrink'});
   slide.addText(`Priorità ${idx+1}   |   Punteggio ${total(c)}   |   ${statusLabel(c.status)}`,{x:.7,y:1.02,w:7.4,h:.28,fontFace:'Aptos',fontSize:11,bold:true,color:'0B4F8A',margin:0});
   const models=pptText((c.models||[]).join(', '));
   slide.addText('ANOMALIA',{x:.7,y:1.42,w:2.2,h:.28,fontFace:'Aptos',fontSize:13,bold:true,color:'0B4F8A',margin:0});
   slide.addText(pptText(c.description||c.title),{x:.7,y:1.76,w:7.25,h:1.20,fontFace:'Aptos',fontSize:12.5,color:'263746',valign:'top',margin:0.03,fit:'shrink'});
   slide.addText(`Modelli: ${models||'—'}\nEnte: ${pptText(c.entity)||'—'}`,{x:.7,y:3.03,w:7.25,h:.58,fontFace:'Aptos',fontSize:10.5,color:'526273',margin:0.02,fit:'shrink'});

   slide.addText('AZIONE CORRENTE',{x:.7,y:3.72,w:2.4,h:.28,fontFace:'Aptos',fontSize:13,bold:true,color:'0B4F8A',margin:0});
   slide.addText(pptText(c.currentAction?.text)||'—',{x:.7,y:4.04,w:7.25,h:.72,fontFace:'Aptos',fontSize:11.5,color:'263746',margin:0.03,fit:'shrink'});
   const owner=pptText(c.currentAction?.owner)||'—', due=c.currentAction?.due?fmtDate(c.currentAction.due):'—', ast=pptText(c.currentAction?.status)||'—';
   slide.addText(`Responsabile: ${owner}   |   Scadenza: ${due}   |   Stato: ${ast}`,{x:.7,y:4.79,w:7.25,h:.28,fontFace:'Aptos',fontSize:9.5,color:'526273',margin:0});

   slide.addText('SOLUZIONE',{x:.7,y:5.18,w:2.0,h:.25,fontFace:'Aptos',fontSize:12,bold:true,color:'0B4F8A',margin:0});
   slide.addText(pptText(c.solution?.text)||'—',{x:.7,y:5.46,w:7.25,h:.62,fontFace:'Aptos',fontSize:10.5,color:'263746',margin:0.02,fit:'shrink'});if(c.solution?.cid||c.solution?.cutIn){slide.addText(`CID: ${pptText(c.solution?.cid)||'—'}   |   CUT IN: ${pptText(c.solution?.cutIn)||'—'}`,{x:.7,y:6.10,w:7.25,h:.22,fontFace:'Aptos',fontSize:9.2,color:'526273',margin:0,fit:'shrink'});}

   if(imgs.length===1){await addContain(slide,imgs[0].dataUrl,8.45,1.45,4.15,4.55)}
   else if(imgs.length>=2){await addContain(slide,imgs[0].dataUrl,8.45,1.45,4.15,2.15);await addContain(slide,imgs[1].dataUrl,8.45,3.82,4.15,2.15)}
   else {slide.addText('Immagini non ancora migrate / disponibili',{x:8.55,y:3.15,w:3.8,h:.45,fontFace:'Aptos',fontSize:11,italic:true,color:'8A96A3',align:'center',margin:0})}
   slide.addText(dIt,{x:.72,y:6.92,w:2.2,h:.22,fontFace:'Aptos',fontSize:9.5,color:'7C8793',margin:0});
   slide.addText(String(page),{x:12.35,y:6.92,w:.35,h:.22,fontFace:'Aptos',fontSize:9.5,color:'7C8793',align:'center',margin:0});page++;

   // HISTORY SLIDES
   const hchunks=historyChunks(c,5);
   if(hchunks.length){
     for(let hi=0;hi<hchunks.length;hi++){
       slide=pptx.addSlide();slide.addImage({data:MENARINI_CONTENT,x:0,y:0,w:13.333,h:7.5});
       slide.addText(`Scheda ${pptText(c.sheet)} — Storico riunioni${hchunks.length>1?` (${hi+1}/${hchunks.length})`:''}`,{x:.7,y:.48,w:11.7,h:.46,fontFace:'Aptos Display',fontSize:21,bold:true,color:'19324D',margin:0,fit:'shrink'});
       let y=1.28;
       for(const u of hchunks[hi]){
         const dt=u.date?fmtDate(u.date):'Data non disponibile';
         slide.addText(dt,{x:.78,y,w:1.65,h:.28,fontFace:'Aptos',fontSize:11,bold:true,color:'0B4F8A',margin:0});
         slide.addText(pptText(u.text)||'—',{x:2.55,y:y-.02,w:9.6,h:.58,fontFace:'Aptos',fontSize:11,color:'263746',margin:0.02,fit:'shrink'});
         if(u.action){
           slide.addText(`Azione: ${pptText(u.action)}${u.owner?`  |  Resp.: ${pptText(u.owner)}`:''}${u.due?`  |  Scad.: ${fmtDate(u.due)}`:''}`,{x:2.55,y:y+.55,w:9.6,h:.28,fontFace:'Aptos',fontSize:9.5,color:'526273',margin:0,fit:'shrink'});
         }
         y+=1.06;
       }
       slide.addText(dIt,{x:.72,y:6.92,w:2.2,h:.22,fontFace:'Aptos',fontSize:9.5,color:'7C8793',margin:0});
       slide.addText(String(page),{x:12.35,y:6.92,w:.35,h:.22,fontFace:'Aptos',fontSize:9.5,color:'7C8793',align:'center',margin:0});page++;
     }
   }

   // ALL IMAGES: remaining images, 4 per slide.
   // First two may already be on the main slide, but all images are still included in gallery
   // to guarantee a complete visual archive.
   if(imgs.length){
     for(let ii=0;ii<imgs.length;ii+=4){
       const chunk=imgs.slice(ii,ii+4);
       slide=pptx.addSlide();slide.addImage({data:MENARINI_CONTENT,x:0,y:0,w:13.333,h:7.5});
       slide.addText(`Scheda ${pptText(c.sheet)} — Immagini${imgs.length>4?` (${Math.floor(ii/4)+1}/${Math.ceil(imgs.length/4)})`:''}`,{x:.7,y:.48,w:11.7,h:.46,fontFace:'Aptos Display',fontSize:21,bold:true,color:'19324D',margin:0,fit:'shrink'});
       const boxes=[
         {x:.75,y:1.35,w:5.8,h:2.35},{x:6.8,y:1.35,w:5.8,h:2.35},
         {x:.75,y:4.05,w:5.8,h:2.35},{x:6.8,y:4.05,w:5.8,h:2.35}
       ];
       for(let j=0;j<chunk.length;j++){
         const im=chunk[j],b=boxes[j];
         await addContain(slide,im.dataUrl,b.x,b.y,b.w,b.h-.32);
         const cap=`${im.section}${im.date?` — ${fmtDate(im.date)}`:''}${im.name?` — ${pptText(im.name)}`:''}`;
         slide.addText(cap,{x:b.x,y:b.y+b.h-.28,w:b.w,h:.22,fontFace:'Aptos',fontSize:8.5,color:'526273',align:'center',margin:0,fit:'shrink'});
       }
       slide.addText(dIt,{x:.72,y:6.92,w:2.2,h:.22,fontFace:'Aptos',fontSize:9.5,color:'7C8793',margin:0});
       slide.addText(String(page),{x:12.35,y:6.92,w:.35,h:.22,fontFace:'Aptos',fontSize:9.5,color:'7C8793',align:'center',margin:0});page++;
     }
   }
 }
 const file=`Failure_Analysis_${d.replaceAll('-','')}.pptx`;await pptx.writeFile({fileName:file});
}
function deleteMeetingSnapshot(id){
 const m=(state.meetings||[]).find(x=>x.id===id);
 if(!m)return;
 if(!confirm(`Eliminare lo snapshot della riunione del ${fmtDate(m.date)}?`))return;
 state.meetings=(state.meetings||[]).filter(x=>x.id!==id);
 save();renderMeetings();toast('Snapshot eliminato');
}

           <td>${esc((c.models||[]).join(', '))}</td>
           <td>${esc(c.entity||'—')}</td>
           <td>${esc(c.currentAction?.text||'—')}</td>
           <td><span class="status ${statusClass(c.status)}">${statusLabel(c.status)}</span></td>
         </tr>`).join('')}</tbody>
       </table></div><div class="snapshot-note">Snapshot salvato: questa vista resta invariata anche se i casi vengono modificati successivamente.</div>`:'<div class="empty">Snapshot storico senza casi.</div>'}
     </div>
   </div>`;
 }).join(''):'<div class="card empty">Nessuna riunione salvata. Crea uno snapshot dalla pagina Agenda riunione.</div>'}</div>`;
 document.querySelectorAll('.export-meeting').forEach(b=>b.onclick=()=>{const m=state.meetings.find(x=>x.id===b.dataset.meeting);if(m)exportAgendaPptx(m.cases||[],m.date)});
 document.querySelectorAll('.delete-meeting').forEach(b=>b.onclick=()=>deleteMeetingSnapshot(b.dataset.meeting));
}
function moveToTrash(id){if(!confirm('Spostare questo caso nel Cestino? Potrai ripristinarlo in seguito.'))return;const c=state.cases.find(x=>x.id===id);c.deletedAt=new Date().toISOString();save();currentCaseId=null;setView('agenda');toast('Caso spostato nel Cestino')}
function deleteAttachment(caseId,kind,attId){if(!confirm('Eliminare questo allegato?'))return;const c=state.cases.find(x=>x.id===caseId);if(kind==='anomaly')c.attachments=(c.attachments||[]).filter(a=>a.id!==attId);else if(kind==='solution')c.solution.attachments=(c.solution.attachments||[]).filter(a=>a.id!==attId);else if(kind.startsWith('update:')){const uid=kind.split(':')[1];const u=(c.updates||[]).find(x=>x.id===uid);if(u)u.attachments=(u.attachments||[]).filter(a=>a.id!==attId)}save();renderCase(caseId);toast('Allegato eliminato')}
function openModal(title,body,onSave,saveLabel='Salva'){const bd=document.getElementById('modalBackdrop');bd.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="x" id="modalX">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn btn-ghost" id="modalCancel">Annulla</button><button class="btn btn-blue" id="modalSave">${saveLabel}</button></div></div>`;bd.classList.add('show');const close=()=>{bd.classList.remove('show');bd.innerHTML=''};document.getElementById('modalCancel').onclick=close;document.getElementById('modalX').onclick=close;bd.onclick=e=>{if(e.target===bd)close()};const escKey=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',escKey)}};document.addEventListener('keydown',escKey);document.getElementById('modalSave').onclick=()=>onSave(close);return {close}}
function modelMultiHtml(selected=[]){return `<div class="multi-wrap"><button type="button" class="multi-button" id="modelMultiBtn">Seleziona modelli…</button><div class="multi-panel" id="modelPanel">${MODELS.map(m=>`<label class="multi-option"><input type="checkbox" value="${esc(m)}" ${selected.includes(m)?'checked':''}> ${esc(m)}</label>`).join('')}</div><div class="chips" id="modelChips" style="margin-top:6px"></div></div>`}
function initModelMulti(){const btn=document.getElementById('modelMultiBtn'),panel=document.getElementById('modelPanel'),chips=document.getElementById('modelChips');const update=()=>{const vals=[...panel.querySelectorAll('input:checked')].map(x=>x.value);chips.innerHTML=vals.map(v=>`<span class="chip">${esc(v)}</span>`).join('');btn.textContent=vals.length?`${vals.length} modello/i selezionato/i`:'Seleziona modelli…'};btn.onclick=()=>panel.classList.toggle('show');panel.querySelectorAll('input').forEach(i=>i.onchange=update);update();return ()=>[...panel.querySelectorAll('input:checked')].map(x=>x.value)}
function partsEditor(id,qty){return `<div id="${id}"></div><button type="button" class="btn btn-soft btn-sm" data-add-parts="${id}" data-qty="${qty?1:0}">+ Aggiungi ricambio</button>`}
function addPartRow(containerId,qty,p={}){const d=document.createElement('div');d.className='inline-row'+(qty?' qty':'');d.innerHTML=`<input placeholder="Part Number" class="pn" value="${esc(p.pn||'')}"><input placeholder="Descrizione" class="desc" value="${esc(p.desc||'')}">${qty?`<input type="number" min="1" placeholder="Q.tà" class="qtyv" value="${esc(p.qty||1)}">`:''}<button type="button" class="btn btn-danger btn-sm">×</button>`;d.querySelector('button').onclick=()=>d.remove();document.getElementById(containerId).appendChild(d)}
function collectParts(id,qty){return [...document.getElementById(id).children].map(r=>({pn:r.querySelector('.pn').value.trim(),desc:r.querySelector('.desc').value.trim(),...(qty?{qty:Number(r.querySelector('.qtyv').value)||1}:{})})).filter(p=>p.pn||p.desc)}
async function filesToData(fileList){const files=[...fileList];return Promise.all(files.map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res({id:crypto.randomUUID(),name:f.name,type:f.type||'application/octet-stream',size:f.size,dataUrl:r.result});r.onerror=()=>res({id:crypto.randomUUID(),name:f.name,type:f.type||'application/octet-stream',size:f.size,dataUrl:null});r.readAsDataURL(f)})))}
function openNewCase(){const body=`<div class="form-grid"><div class="field"><label class="required">Scheda</label><input id="fSheet" placeholder="es. 306"></div><div class="field"><label class="required">Data apertura</label><input type="date" id="fDate" value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label class="required">ANOMALIA</label><input id="fTitle" placeholder="Titolo sintetico dell'anomalia"></div><div class="field full"><label class="required">Descrizione</label><textarea id="fDesc"></textarea></div><div class="field"><label class="required">Modelli coinvolti</label>${modelMultiHtml([])}</div><div class="field"><label class="required">Ente</label><select id="fEntity"><option value="">Seleziona…</option>${ENTITIES.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Categoria</label><select id="fCategory"><option value="">Seleziona…</option>${CATEGORIES.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Stato</label><select id="fStatus"><option value="open">Aperto</option><option value="suspended">Sospeso</option></select></div></div><div class="form-section"><div class="form-title">Ricambi ANOMALIA <span class="hint">(facoltativi)</span></div>${partsEditor('newParts',false)}</div><div class="form-section"><div class="form-title">Allegati ANOMALIA</div><input type="file" id="fFiles" multiple><div class="hint">Immagini, PDF, Excel, Word, PowerPoint e altri file tecnici.</div></div><div class="form-section"><div class="form-title">Scoring</div><div class="form-grid"><div class="field"><label class="required">Numero casi / frequenza</label><input type="number" min="0" id="fFreq" value="0"></div><div class="field"><label class="required">Sicurezza</label><select id="fSafety"><option value="1">Nessun pericolo per l’utilizzatore — 1</option><option value="10">Adrenalinico — 10</option><option value="20">Molto adrenalinico per utilizzatore — 20</option></select></div><div class="field"><label class="required">Sales deterrent</label><select id="fSales"><option value="1">Cliente insoddisfatto — 1</option><option value="3">Cliente estremamente insoddisfatto — 3</option><option value="5">Cliente vuole cambiare la macchina — 5</option><option value="7">Cliente a rischio di causa legale — 7</option><option value="10">Causa legale in corso — 10</option></select></div><div class="field"><label class="required">Costi garanzia (€)</label><input type="number" min="0" step="0.01" id="fWarranty" value="0"></div><div class="field"><label class="required">Urgenza</label><select id="fUrgency"><option value="1">Non urgente — 1</option><option value="3">Mediamente urgente — 3</option><option value="5">Molto urgente — 5</option><option value="10">Prioritario — 10</option></select></div><div class="field"><label>Bonus manuale</label><input type="number" min="0" max="50" id="fBonus" value="0"></div><div class="field full"><label>Motivazione bonus</label><input id="fBonusReason"></div></div></div>`;openModal('Nuovo caso',body,async close=>{const getModels=window.__getModels;const models=getModels();const required=[['fSheet','Scheda'],['fTitle','ANOMALIA'],['fDesc','Descrizione'],['fEntity','Ente']];for(const [id,n] of required){if(!document.getElementById(id).value.trim()){alert(`Compila il campo ${n}.`);return}}if(!models.length){alert('Seleziona almeno un modello coinvolto.');return}const atts=await filesToData(document.getElementById('fFiles').files);state.cases.push({id:crypto.randomUUID(),sheet:document.getElementById('fSheet').value.trim(),title:document.getElementById('fTitle').value.trim(),status:document.getElementById('fStatus').value,date:document.getElementById('fDate').value,models,entity:document.getElementById('fEntity').value,category:document.getElementById('fCategory').value,description:document.getElementById('fDesc').value.trim(),parts:collectParts('newParts',false),attachments:atts,frequencyCases:Number(document.getElementById('fFreq').value),safety:Number(document.getElementById('fSafety').value),sales:Number(document.getElementById('fSales').value),warrantyCost:Number(document.getElementById('fWarranty').value),urgency:Number(document.getElementById('fUrgency').value),bonus:Number(document.getElementById('fBonus').value),bonusReason:document.getElementById('fBonusReason').value.trim(),ageScore:ageScoreFromDate(document.getElementById('fDate').value),currentAction:{text:'',owner:'',due:'',status:'Aperta'},solution:{text:'',cid:'',cutIn:'',parts:[],attachments:[]},updates:[],deletedAt:null});save();close();render();toast('Nuovo caso creato')});window.__getModels=initModelMulti();document.querySelector('[data-add-parts="newParts"]').onclick=()=>addPartRow('newParts',false)}
function openEditCase(c){const body=`<div class="form-grid"><div class="field"><label>Scheda</label><input id="eSheet" value="${esc(c.sheet)}"></div><div class="field"><label>Stato</label><select id="eStatus"><option value="open" ${c.status==='open'?'selected':''}>Aperto</option><option value="suspended" ${c.status==='suspended'?'selected':''}>Sospeso</option><option value="closed" ${c.status==='closed'?'selected':''}>Risolto</option></select></div><div class="field full"><label>ANOMALIA</label><input id="eTitle" value="${esc(c.title)}"></div><div class="field full"><label>Descrizione</label><textarea id="eDesc">${esc(c.description||'')}</textarea></div><div class="field"><label>Ente responsabile</label><select id="eEntity"><option value="">—</option>${ENTITIES.map(x=>`<option ${x===c.entity?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Categoria</label><select id="eCategory"><option value="">—</option><option value="Riparativa" ${categoryLabel(c.category)==='Riparativa'?'selected':''}>Riparativa</option><option value="Service" ${categoryLabel(c.category)==='Service'?'selected':''}>Service</option></select></div><div class="field full"><label>Modelli coinvolti</label>${modelMultiHtml(c.models||[])}</div></div>`;openModal('Modifica caso',body,close=>{const models=window.__getModels();if(!document.getElementById('eSheet').value.trim()){alert('Compila il campo Scheda.');return}if(!document.getElementById('eTitle').value.trim()){alert('Compila il campo ANOMALIA.');return}if(!models.length){alert('Seleziona almeno un modello coinvolto.');return}c.sheet=document.getElementById('eSheet').value.trim();c.status=document.getElementById('eStatus').value;c.title=document.getElementById('eTitle').value.trim();c.description=document.getElementById('eDesc').value.trim();c.entity=document.getElementById('eEntity').value;c.category=document.getElementById('eCategory').value;c.models=models;save();close();renderCase(c.id);toast('Caso aggiornato')});window.__getModels=initModelMulti()}

function openUpdate(c){const body=`<div class="form-grid"><div class="field"><label>Data riunione</label><input type="date" id="uDate" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Stato caso</label><select id="uCaseStatus"><option value="open" ${c.status==='open'?'selected':''}>Aperto</option><option value="suspended" ${c.status==='suspended'?'selected':''}>Sospeso</option><option value="closed" ${c.status==='closed'?'selected':''}>Risolto</option></select></div><div class="field full"><label class="required">Aggiornamento</label><textarea id="uText" placeholder="Cosa è emerso / cosa è stato deciso"></textarea></div><div class="field full"><label>Azione corrente</label><input id="uAction" value="${esc(c.currentAction?.text||'')}"></div><div class="field"><label>Responsabile</label><select id="uOwner"><option value="">—</option>${ENTITIES.map(x=>`<option ${x===c.currentAction?.owner?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Scadenza</label><input type="date" id="uDue" value="${esc(c.currentAction?.due||'')}"></div><div class="field"><label>Stato azione</label><select id="uActionStatus"><option>Aperta</option><option>In attesa</option><option>Completata</option><option>Chiusa</option></select></div></div><div class="form-section"><div class="form-title">Ricambi discussi / richiesti</div>${partsEditor('updateParts',true)}</div><div class="form-section"><div class="form-title">Allegati aggiornamento</div><input type="file" id="uFiles" multiple></div>`;openModal('Aggiorna riunione',body,async close=>{const txt=document.getElementById('uText').value.trim();if(!txt){alert('Inserisci un aggiornamento prima di salvare.');return}const atts=await filesToData(document.getElementById('uFiles').files);const u={id:crypto.randomUUID(),date:document.getElementById('uDate').value,text:txt,action:document.getElementById('uAction').value.trim(),owner:document.getElementById('uOwner').value,due:document.getElementById('uDue').value,status:document.getElementById('uActionStatus').value,parts:collectParts('updateParts',true),attachments:atts};c.updates.push(u);c.status=document.getElementById('uCaseStatus').value;c.currentAction={text:u.action,owner:u.owner,due:u.due,status:u.status};save();close();renderCase(c.id);toast('Aggiornamento salvato')});document.querySelector('[data-add-parts="updateParts"]').onclick=()=>addPartRow('updateParts',true)}
function openSolution(c){const s=ensureSolution(c);const body=`<div class="form-grid"><div class="field full"><label>Descrizione soluzione</label><textarea id="sText">${esc(s.text||'')}</textarea></div><div class="field"><label>CID</label><input id="sCid" value="${esc(s.cid||'')}" placeholder="es. 30958"></div><div class="field"><label>CUT IN</label><input id="sCutIn" value="${esc(s.cutIn||'')}" placeholder="es. VIN / data / riferimento introduzione"></div></div><div class="form-section"><div class="form-title">Ricambi SOLUZIONE</div>${partsEditor('solutionParts',true)}</div><div class="form-section"><div class="form-title">Allegati SOLUZIONE</div><input type="file" id="sFiles" multiple><div class="hint">Gli allegati esistenti non vengono rimossi; puoi eliminarli direttamente dalla scheda.</div></div>`;openModal('Modifica soluzione',body,async close=>{const newAtt=await filesToData(document.getElementById('sFiles').files);ensureSolution(c);c.solution.text=document.getElementById('sText').value.trim();c.solution.cid=document.getElementById('sCid').value.trim();c.solution.cutIn=document.getElementById('sCutIn').value.trim();c.solution.parts=collectParts('solutionParts',true);c.solution.attachments=[...(c.solution.attachments||[]),...newAtt];save();close();renderCase(c.id);toast('Soluzione aggiornata')});(s.parts||[]).forEach(p=>addPartRow('solutionParts',true,p));document.querySelector('[data-add-parts="solutionParts"]').onclick=()=>addPartRow('solutionParts',true)}

document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>setView(n.dataset.view));document.getElementById('newCaseTop').onclick=openNewCase;refreshCounts();render();
})();
