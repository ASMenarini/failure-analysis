function unfoldHeaderLines(text){return String(text||'').replace(/\r?\n[ \t]+/g,' ')}

async function openEmailInline(attId,name='Messaggio.msg'){

      data=parseSimpleEml(await r.text());
    }else{
      const buf=await r.arrayBuffer();

    const closeBtn=document.getElementById('emailViewerClose'),xBtn=document.getElementById('emailViewerX'),bd=document.getElementById('modalBackdrop');
    if(closeBtn)closeBtn.onclick=ui.close;if(xBtn)xBtn.onclick=ui.close;if(bd)bd.onclick=e=>{if(e.target===bd)ui.close()};

  }
}

function networkFileUri(value){let x=String(value||'').trim();if(/^file:\/\//i.test(x))return x;if(/^[A-Za-z]:[\\/]/.test(x))return 'file:///'+x.replace(/\\/g,'/');if(/^\\\\/.test(x))return 'file:'+x.replace(/\\/g,'/');return ''}

function renderLegacyMissing(a,caseId,kind){return `<div class="legacy-missing" title="${esc(a.legacyPath||a.name||'')}"><span class="legacy-badge">↗</span><div class="legacy-text"><div class="legacy-name">${esc(a.name||'Collegamento storico')}</div><div>File storico non migrato · non disponibile online</div></div><div class="legacy-actions"><button class="btn btn-danger btn-sm delete-attachment" data-case="${esc(caseId)}" data-kind="${esc(kind)}" data-att="${esc(a.id)}" type="button">Rimuovi</button></div></div>`}
function attachmentFileKind(a){const n=String(a?.name||'').toLowerCase(),t=String(a?.type||'').toLowerCase();if(isImageAttachment(a))return 'IMMAGINE';if(t==='application/pdf'||/\.pdf$/i.test(n))return 'PDF';if(/\.msg$/i.test(n)||t==='application/vnd.ms-outlook')return 'MSG';if(/\.pptx?$/i.test(n)||t.includes('presentation'))return /\.ppt$/i.test(n)?'PPT':'PPTX';if(/\.xlsx?$/i.test(n)||t.includes('spreadsheet')||t.includes('excel'))return /\.xls$/i.test(n)?'XLS':'XLSX';if(/\.docx?$/i.test(n)||t.includes('wordprocessing')||t.includes('msword'))return /\.doc$/i.test(n)?'DOC':'DOCX';return (n.split('.').pop()||'FILE').toUpperCase()}
function attachmentSummaryAction(a){const kind=attachmentFileKind(a);if(a?.external){if(externalTargetType(a.externalUrl)==='network')return `<button class="btn btn-soft btn-sm summary-open-network" data-path="${esc(a.externalUrl)}" type="button">Apri collegamento</button>`;return `<a class="btn btn-soft btn-sm" href="${esc(a.externalUrl)}" target="_blank" rel="noopener noreferrer">Apri collegamento</a>`}if(!a?.live)return '<span class="muted">Non disponibile online</span>';if(kind==='IMMAGINE')return `<button class="btn btn-soft btn-sm summary-open-image" data-id="${esc(a.id)}" type="button">Apri / Zoom</button>`;if(kind==='MSG')return `<button class="btn btn-soft btn-sm summary-open-email" data-att="${esc(a.id)}" data-name="${esc(a.name)}" type="button">Apri MSG</button>`;if(kind==='PDF')return `<a class="btn btn-soft btn-sm" href="${attachmentOpenUrl(a.id)}" target="_blank" rel="noopener noreferrer">Apri PDF</a>`;if(['PPT','PPTX','XLS','XLSX','DOC','DOCX'].includes(kind))return `<a class="btn btn-soft btn-sm" href="${officeViewerUrl(a.id)}" target="_blank" rel="noopener noreferrer">Apri online</a>`;return `<a class="btn btn-soft btn-sm" href="${attachmentOpenUrl(a.id)}" target="_blank" rel="noopener noreferrer">Apri file</a>`}
function isPdfAttachment(a){const n=String(a?.name||'').toLowerCase(),t=String(a?.type||'').toLowerCase();return t==='application/pdf'||/\.pdf$/i.test(n)}
function allCaseImages(c){const out=[];const add=(arr,source)=>{(arr||[]).forEach(a=>{if(isImageAttachment(a))out.push({...a,source})})};add(c.attachments,'DESCRIZIONE');add(c.solution?.attachments,'SOLUZIONE');(c.updates||[]).forEach(u=>add(u.attachments,`RIUNIONE ${fmtDate(u.date)}`));return out}
function allCaseCoverCandidates(c){const out=[];const add=(arr,source)=>{(arr||[]).forEach(a=>{if(isImageAttachment(a)||isPdfAttachment(a))out.push({...a,source})})};add(c.attachments,'DESCRIZIONE');add(c.solution?.attachments,'SOLUZIONE');(c.updates||[]).forEach(u=>add(u.attachments,`RIUNIONE ${fmtDate(u.date)}`));return out}

function ensureLightbox(){let box=document.getElementById('caseLightbox');if(box)return box;box=document.createElement('div');box.id='caseLightbox';box.className='lightbox';box.innerHTML=`<div class="lightbox-inner"><button class="lightbox-close" type="button" aria-label="Chiudi">×</button><button class="lightbox-prev" type="button" aria-label="Precedente">‹</button><img alt="Anteprima immagine"><button class="lightbox-next" type="button" aria-label="Successiva">›</button><button class="lightbox-zoom-out" type="button" aria-label="Riduci">−</button><button class="lightbox-reset" type="button">100%</button><button class="lightbox-zoom-in" type="button" aria-label="Ingrandisci">+</button><div class="lightbox-caption"></div></div>`;document.body.appendChild(box);box.onclick=e=>{if(e.target===box)closeLightbox()};box.querySelector('.lightbox-close').onclick=closeLightbox;box.querySelector('.lightbox-zoom-in').onclick=()=>setLightboxZoom(lightboxState.zoom+.25);box.querySelector('.lightbox-zoom-out').onclick=()=>setLightboxZoom(lightboxState.zoom-.25);box.querySelector('.lightbox-reset').onclick=()=>setLightboxZoom(1);box.querySelector('img').onclick=()=>setLightboxZoom(lightboxState.zoom>1?1:2);document.addEventListener('keydown',e=>{if(!box.classList.contains('show'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')stepLightbox(-1);if(e.key==='ArrowRight')stepLightbox(1);if(e.key==='+'||e.key==='=')setLightboxZoom(lightboxState.zoom+.25);if(e.key==='-')setLightboxZoom(lightboxState.zoom-.25)});return box}
let lightboxState={images:[],index:0,zoom:1};
function openLightbox(images,startId){const list=(images||[]).filter(a=>isImageAttachment(a)&&a.dataUrl);if(!list.length){alert('Immagine non disponibile per lo zoom.');return}let idx=list.findIndex(a=>String(a.id)===String(startId));if(idx<0)idx=0;lightboxState={images:list,index:idx,zoom:1};const box=ensureLightbox();box.classList.add('show');document.body.style.overflow='hidden';updateLightbox()}
function updateLightbox(){const box=ensureLightbox(),list=lightboxState.images,a=list[lightboxState.index];if(!a)return;const img=box.querySelector('img');img.src=a.dataUrl;lightboxState.zoom=1;applyLightboxZoom();box.querySelector('.lightbox-caption').textContent=`${a.name||'Immagine'} · ${lightboxState.index+1} / ${list.length}`;box.querySelector('.lightbox-prev').style.display=list.length>1?'grid':'none';box.querySelector('.lightbox-next').style.display=list.length>1?'grid':'none';box.querySelector('.lightbox-prev').onclick=()=>stepLightbox(-1);box.querySelector('.lightbox-next').onclick=()=>stepLightbox(1)}
function setLightboxZoom(v){lightboxState.zoom=Math.max(.5,Math.min(4,Math.round(v*100)/100));applyLightboxZoom()}
function applyLightboxZoom(){const box=ensureLightbox(),img=box.querySelector('img'),z=lightboxState.zoom||1;img.style.transform=`scale(${z})`;img.classList.toggle('is-zoomed',z>1);box.querySelector('.lightbox-reset').textContent=Math.round(z*100)+'%'}
function stepLightbox(delta){const n=lightboxState.images.length;if(!n)return;lightboxState.index=(lightboxState.index+delta+n)%n;updateLightbox()}
function closeLightbox(){const box=document.getElementById('caseLightbox');if(box)box.classList.remove('show');document.body.style.overflow=''}

function isCriticalCase(c){return total(c)>=60}
function isAgedCase(c){return ageScoreForCase(c)>=12}
function dueStatus(due,status){
  const s=String(status||'').trim().toLowerCase();
  if(['completata','completato','chiusa','chiuso','closed','done'].includes(s))return {kind:'done',label:'Completata'};
  if(!due)return {kind:'none',label:''};
  const today=localDateISO();
  if(due<today)return {kind:'overdue',label:'Scaduta'};
  const a=new Date(today+'T12:00:00'),b=new Date(due+'T12:00:00');
  const days=Math.ceil((b-a)/86400000);
  if(days<=7)return {kind:'soon',label:days===0?'Oggi':days===1?'Domani':`Tra ${days} gg`};
  return {kind:'ok',label:''};
}
function dueBadgeHtml(due,status){const d=dueStatus(due,status);return d.kind==='none'||(!d.label&&d.kind==='ok')?'':`<span class="v18-due v18-due-${d.kind}">${esc(d.label)}</span>`}
function businessBadgesHtml(c){const b=[];const ageMonths=ageScoreForCase(c);if(isCriticalCase(c))b.push('<span class="v18-badge v18-badge-critical">CRITICAL</span>');b.push(`<span class="v18-badge ${ageMonths>=12?'v18-badge-aged':'v18-badge-age'}">AGE ${ageMonths} mesi</span>`);return `<span class="v18-case-badges">${b.join('')}</span>`}
function attachmentStats(c){const all=[...(c.attachments||[]),...(c.solution?.attachments||[]),...((c.updates||[]).flatMap(u=>u.attachments||[]))];let images=0,email=0,docs=0,links=0;all.forEach(a=>{if(a.external){links++;return}const ext=attachmentExtension(a).toLowerCase();if(isImageAttachment(a))images++;else if(['msg','eml'].includes(ext))email++;else docs++});return {total:all.length,images,email,docs,links}}

function renderRailAttachmentsCompact(arr=[],kind,caseId){

  return `<div class="attachment-rail-list">${arr.map(a=>{
    const img=isImageAttachment(a);
    const ext=attachmentExtension(a)||'FILE';
    const kindLabel=attachmentKindLabel(a)||ext;
    const displayName=a.external?externalDisplayName(a):(a.name||'Allegato');
    let icon='';
    if(img&&a.dataUrl){icon=`<div class="attachment-rail-fileicon img"><img src="${esc(a.dataUrl)}" alt="${esc(displayName)}"></div>`}
    else icon=`<div class="attachment-rail-fileicon">${esc((a.external?(externalTargetType(a.externalUrl)==='network'?'RETE':'LINK'):ext).slice(0,5))}</div>`;
    let open='';
    if(a.external){

      open='';
    }else if(img){
      open=`<button class="btn btn-soft btn-sm open-image-inline" data-image-src="${esc(a.dataUrl)}" data-image-name="${esc(a.name||'Immagine')}" data-image-id="${esc(a.id)}" type="button">Zoom</button>`;
    }else{
      open=attachmentOpenAction(a,'Apri');
    }
    const download=(!a.external&&a.live)?`<a class="btn btn-ghost btn-sm" href="${attachmentDownloadUrl(a.id)}">Scarica</a>`:'';
    const edit=a.external?`<button class="btn btn-ghost btn-sm edit-external-link" data-att="${esc(a.id)}" type="button">Link</button>`:'';

    const del=`<button class="btn btn-danger btn-sm delete-attachment" data-case="${esc(caseId)}" data-kind="${esc(kind)}" data-att="${esc(a.id)}" type="button">×</button>`;

  }).join('')}</div>`;
}

function renderParts(parts=[],qty){if(!parts.length)return '<div class="muted" style="margin-top:10px">Nessun ricambio indicato.</div>';return `<div style="margin-top:12px"><b>Ricambi</b><table class="parts-table"><thead><tr><th>Part Number</th><th>Descrizione</th>${qty?'<th>Q.tà</th>':''}</tr></thead><tbody>${parts.map(p=>`<tr><td>${esc(p.pn||'—')}</td><td>${esc(p.desc||'—')}</td>${qty?`<td>${esc(p.qty||'—')}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function renderAttachments(arr=[],kind,caseId){
if(!arr.length)return '<div class="muted" style="margin-top:8px">Nessun allegato.</div>';
const legacy=arr.filter(a=>!a.live&&!a.external);
const external=arr.filter(a=>a.external);
const online=arr.filter(a=>a.live&&!a.external);
const legacyHtml=legacy.length?`<div style="display:flex;flex-direction:column;gap:7px;margin-top:8px">${legacy.map(a=>renderLegacyMissing(a,caseId,kind)).join('')}</div>`:'';
const externalHtml=external.length?`<div class="attach-grid" style="margin-top:8px">${external.map(a=>{const network=externalTargetType(a.externalUrl)==='network';const displayName=externalDisplayName(a);const primary=network?`<button class="btn btn-soft btn-sm open-network-file" data-path="${esc(a.externalUrl)}" type="button">Apri</button>`:`<a class="btn btn-soft btn-sm" href="${esc(a.externalUrl)}" target="_blank" rel="noopener noreferrer">Apri</a>`;return `<div class="attachment document-attachment external-attachment"><div class="doc-preview"><div class="doc-ext">${network?'RETE':'LINK'}</div><div class="doc-kind">${esc(network?'Rete aziendale':(a.externalProvider||'Collegamento esterno'))}</div></div><div class="attachment-body"><div class="attachment-name" title="${esc(displayName)}">${esc(displayName)}</div><div class="attachment-tools">${primary}<button class="btn btn-ghost btn-sm edit-external-link" data-att="${esc(a.id)}" type="button">Modifica link</button><button class="btn btn-danger btn-sm delete-attachment" data-case="${esc(caseId)}" data-kind="${esc(kind)}" data-att="${esc(a.id)}" type="button">Rimuovi</button></div></div></div>`}).join('')}</div>`:'';
const onlineHtml=online.length?`<div class="attach-grid" style="margin-top:8px">${online.map(a=>{const img=isImageAttachment(a);const media=img?`<div class="attachment-media"><img class="hover-preview-source js-case-image-direct" data-image-src="${esc(a.dataUrl)}" data-image-name="${esc(a.name)}" data-image-id="${esc(a.id)}" data-preview-src="${esc(a.dataUrl)}" src="${esc(a.dataUrl)}" alt="${esc(a.name)}"></div>`:`<div class="doc-preview"><div class="doc-ext">${esc(attachmentExtension(a))}</div><div class="doc-kind">${esc(attachmentKindLabel(a))}</div></div>`;return `<div class="attachment ${img?'image-attachment':'document-attachment'}">${media}<div class="attachment-body"><div class="attachment-name" title="${esc(a.name)}">${esc(a.name)}</div><div class="attachment-tools">${img?`<button class="btn btn-soft btn-sm choose-cover-inline" data-case="${caseId}" type="button">Scegli copertina</button><button class="btn btn-soft btn-sm open-image-inline" data-image-src="${esc(a.dataUrl)}" data-image-name="${esc(a.name)}" data-image-id="${esc(a.id)}" type="button">Apri / Zoom</button>`:attachmentOpenAction(a,'Apri')}<a class="btn btn-ghost btn-sm" href="${attachmentDownloadUrl(a.id)}">Scarica</a><button class="btn btn-danger btn-sm delete-attachment" data-case="${caseId}" data-kind="${kind}" data-att="${a.id}">Elimina</button></div></div></div>`}).join('')}</div>`:'';
return legacyHtml+externalHtml+onlineHtml;
}

function bindAttachmentButtons(){
  document.querySelectorAll('.delete-attachment').forEach(b=>b.onclick=()=>deleteAttachment(b.dataset.case,b.dataset.kind,b.dataset.att));
  document.querySelectorAll('.choose-cover-inline').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const c=state.cases.find(x=>String(x.id)===String(b.dataset.case))||state.cases.find(x=>String(x.id)===String(currentCaseId));if(!c){alert('Caso non trovato.');return}openCoverPicker(c)});
  document.querySelectorAll('.edit-external-link').forEach(b=>b.onclick=()=>{const c=state.cases.find(x=>String(x.id)===String(currentCaseId));if(!c)return;const all=[...(c.attachments||[]),...(c.solution?.attachments||[]),...((c.updates||[]).flatMap(u=>u.attachments||[]))];const a=all.find(x=>String(x.id)===String(b.dataset.att));if(a)openEditExternalLink(c,a)});
  document.querySelectorAll('.open-network-file').forEach(b=>b.onclick=()=>openNetworkFile(b.dataset.path||''));
  document.querySelectorAll('.open-email-inline').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();openEmailInline(b.dataset.att,b.dataset.name||'Messaggio.msg')});
  document.querySelectorAll('.add-external-link').forEach(b=>b.onclick=()=>{const c=state.cases.find(x=>String(x.id)===String(currentCaseId));if(c)openAddExternalLink(c,b.dataset.section||'anomaly',b.dataset.updateId||null)});
  document.querySelectorAll('.open-image-inline').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const src=b.dataset.imageSrc||'';if(!src){alert('Immagine non disponibile.');return}openLightbox([{id:b.dataset.imageId||'direct',name:b.dataset.imageName||'Immagine',dataUrl:src,type:'image/*',live:true}],b.dataset.imageId||'direct')});
  document.querySelectorAll('.js-case-image-direct').forEach(img=>img.onclick=e=>{e.preventDefault();e.stopPropagation();const src=img.dataset.imageSrc||img.src;if(!src)return;openLightbox([{id:img.dataset.imageId||'direct',name:img.dataset.imageName||img.alt||'Immagine',dataUrl:src,type:'image/*',live:true}],img.dataset.imageId||'direct')});
  bindThumbLightboxes(document);bindImageHoverPreview();
}

function ensureImageHoverPreview(){let box=document.getElementById('imageHoverPreview');if(!box){box=document.createElement('div');box.id='imageHoverPreview';box.className='image-hover-preview';box.innerHTML='<img alt="Anteprima allegato">';document.body.appendChild(box)}return box}
function bindImageHoverPreview(){const box=ensureImageHoverPreview(),img=box.querySelector('img');let timer=null;const hide=()=>{clearTimeout(timer);box.classList.remove('show');img.removeAttribute('src')};document.querySelectorAll('.hover-preview-source').forEach(el=>{el.onmouseenter=()=>{timer=setTimeout(()=>{img.src=el.dataset.previewSrc||el.src;box.classList.add('show')},180)};el.onmousemove=e=>{if(!box.classList.contains('show'))return;const pad=18,bw=box.offsetWidth||620,bh=box.offsetHeight||420;let x=e.clientX+pad,y=e.clientY+pad;if(x+bw>window.innerWidth-10)x=e.clientX-bw-pad;if(y+bh>window.innerHeight-10)y=window.innerHeight-bh-10;if(y<10)y=10;box.style.left=Math.max(10,x)+'px';box.style.top=Math.max(10,y)+'px'};el.onmouseleave=hide});}

}
async function pptImageData(src){
  if(!src)return null;
  const v=String(src);
  if(v.startsWith('data:'))return v;
  try{
    const res=await fetch(v,{mode:'cors'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const blob=await res.blob();
    return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Lettura immagine fallita'));r.readAsDataURL(blob)});
  }catch(e){console.warn('Immagine PPTX non caricabile:',v,e);return null}
}
async function imgSize(data){return new Promise(res=>{const im=new Image();im.onload=()=>res({w:im.naturalWidth||1,h:im.naturalHeight||1});im.onerror=()=>res({w:1,h:1});im.src=data})}
async function addContain(slide,src,x,y,w,h){const data=await pptImageData(src);if(!data)return false;const d=await imgSize(data);const r=Math.min(w/d.w,h/d.h),iw=d.w*r,ih=d.h*r;slide.addImage({data,x:x+(w-iw)/2,y:y+(h-ih)/2,w:iw,h:ih});return true}

(c.attachments||[]).forEach(a=>push(a,'ANOMALIA','',c.date));(c.updates||[]).forEach(u=>(u.attachments||[]).forEach(a=>push(a,'RIUNIONE',u.text||'',u.date)));(c.solution?.attachments||[]).forEach(a=>push(a,'SOLUZIONE','',c.solution?.date||''));return imgs;
}

function pptLogo(deck,slide,cover=false){
const blue='0B4F8A';
const logoRatio=591/379;
if(cover){
  const boxX=.55,boxY=.42,boxW=1.55,boxH=.98;
  slide.addShape(deck.ShapeType.roundRect,{x:boxX,y:boxY,w:boxW,h:boxH,fill:{color:'FFFFFF'},line:{color:'FFFFFF'},rectRadius:.08});
  const logoH=.78,logoW=logoH*logoRatio;
  slide.addImage({data:MENARINI_LOGO_BASE64,x:boxX+(boxW-logoW)/2,y:boxY+(boxH-logoH)/2,w:logoW,h:logoH});
  slide.addText('FAILURE ANALYSIS',{x:2.35,y:.62,w:6.5,h:.5,fontFace:'Aptos Display',fontSize:20,bold:true,color:'FFFFFF',margin:0});
}else{
  slide.addShape(deck.ShapeType.rect,{x:.45,y:.16,w:12.45,h:.5,fill:{color:blue},line:{color:blue}});
  const boxX=.58,boxY=.20,boxW=.86,boxH=.42;
  slide.addShape(deck.ShapeType.roundRect,{x:boxX,y:boxY,w:boxW,h:boxH,fill:{color:'FFFFFF'},line:{color:'FFFFFF'},rectRadius:.05});
  const logoH=.34,logoW=logoH*logoRatio;
  slide.addImage({data:MENARINI_LOGO_BASE64,x:boxX+(boxW-logoW)/2,y:boxY+(boxH-logoH)/2,w:logoW,h:logoH});
  slide.addText('FAILURE ANALYSIS',{x:1.6,y:.24,w:6.4,h:.32,fontFace:'Aptos',fontSize:13,bold:true,color:'FFFFFF',margin:0});
}
}
function addPptHeader(deck,slide,title,dateText,page,cover=false){
slide.background={color:cover?'0B4F8A':'F7F9FC'};
pptLogo(deck,slide,cover);
if(cover){slide.addText(title,{x:.65,y:2.55,w:11.7,h:.75,fontFace:'Aptos Display',fontSize:34,bold:true,color:'FFFFFF',margin:0,fit:'shrink'});slide.addText(dateText,{x:.72,y:6.92,w:2.3,h:.25,fontFace:'Aptos',fontSize:11,color:'FFFFFF',margin:0});return}

}

async function imageDataForPpt(a){
 if(!a||!attachmentLooksImage(a))return null;
 const key=String(a.id||a.dataUrl||a.name||Math.random()); if(PPT_IMG_CACHE.has(key))return PPT_IMG_CACHE.get(key);
 const src=a.dataUrl||a.public_url||a.url||''; if(!src)return null;
 const p=(async()=>{try{if(/^data:image\//i.test(src))return src;const res=await fetch(src,{cache:'no-store'});if(!res.ok)return null;const blob=await res.blob();if(!String(blob.type||'').startsWith('image/')&&!attachmentLooksImage(a))return null;return await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve(null);r.readAsDataURL(blob)});}catch(e){console.warn('Immagine PPT non leggibile',a?.name,e);return null}})();
 PPT_IMG_CACHE.set(key,p);return p;
}
async function buildCaseImagesForPpt(c){
 const raw=[];const push=(a,section,label,date,rank=9)=>{if(a&&attachmentLooksImage(a))raw.push({att:a,id:String(a.id||''),section,label:label||'',date:date||'',rank,name:a.name||a.file_name||''})};
 (c.attachments||[]).forEach(a=>push(a,'ANOMALIA','',c.date,1));
 (c.updates||[]).forEach(u=>(u.attachments||[]).forEach(a=>push(a,'RIUNIONE',u.text||'',u.date,2)));
 (c.solution?.attachments||[]).forEach(a=>push(a,'SOLUZIONE','',c.solution?.date||'',3));
 const seen=new Set(),items=[];for(const x of raw){const k=x.id||`${x.section}|${x.date}|${x.name}`;if(seen.has(k))continue;seen.add(k);const dataUrl=await imageDataForPpt(x.att);if(dataUrl)items.push({...x,dataUrl});}
 let cover=null;
 if(c.coverAttachmentId){
   cover=items.find(x=>x.id&&x.id===String(c.coverAttachmentId))||null;
   if(!cover){const chosen=allCaseCoverCandidates(c).find(a=>String(a.id)===String(c.coverAttachmentId));if(chosen&&isPdfAttachment(chosen)){const pdfData=await pdfFirstPageDataForPpt(chosen);if(pdfData)cover={att:chosen,id:String(chosen.id||''),section:'PDF COPERTINA',label:'',date:c.date||'',rank:0,name:chosen.name||'',dataUrl:pdfData}}}
 }
 if(!cover)cover=items.find(x=>x.section==='ANOMALIA')||items[0]||null;
 const gallery=items.filter(x=>!cover||x.id!==cover.id||!x.id).filter((x,i,arr)=>!cover || x!==cover);
 return {cover,gallery,all:items};
}
function historyPagesForPpt(c){
 const hist=(c.updates||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
 const pages=[];let page=[];let used=0;
 const available=5.08; // usa quasi tutta l'area utile fino al footer
 for(const u of hist){
   const text=pptText(u.text)||'—';
   const hasImg=(u.attachments||[]).some(a=>attachmentLooksImage(a));
   let h=Math.min(4.8,Math.max(.62,0.48+Math.ceil(text.length/310)*.34));
   if(hasImg)h=Math.max(h,1.7);
   const consumed=h+(u.action?.trim()?.37:.18);
   if(page.length&&used+consumed>available){pages.push(page);page=[];used=0}
   page.push({...u,__pptHeight:h});
   used+=consumed;
 }
 if(page.length)pages.push(page);return pages;
}

let legacySourceFiles=[];
let legacyMatches=[];

function decodeLegacyText(v=''){
  let s=String(v??'').normalize('NFKC').trim();
  try{s=decodeURIComponent(s)}catch{}
  return s;
}
function normalizeLegacyPath(v=''){
  return decodeLegacyText(v)
    .replace(/\\/g,'/')
    .replace(/\/+/g,'/')
    .replace(/^file:\/\//i,'')
    .replace(/^#+|#+$/g,'')
    .trim()
    .toLowerCase();
}
function cleanFileName(v=''){
  return decodeLegacyText(v)
    .replace(/^#+|#+$/g,'')
    .replace(/[?#].*$/,'')
    .trim()
    .toLowerCase();
}
function baseName(v=''){
  const p=normalizeLegacyPath(v).split('/');
  return cleanFileName(p[p.length-1]||'');
}
function legacyPathVariants(v=''){
  const raw=decodeLegacyText(v);
  const parts=raw.split('#').map(x=>x.trim()).filter(Boolean);
  const source=parts.length?parts:[raw];
  const out=[];
  for(const part of source){
    const norm=normalizeLegacyPath(part);
    if(norm&&!out.includes(norm))out.push(norm);
  }
  return out;
}
function legacyFileNames(v=''){
  const out=[];
  for(const part of legacyPathVariants(v)){
    const n=baseName(part);
    if(n&&!out.includes(n))out.push(n);
  }
  const direct=baseName(v);
  if(direct&&!out.includes(direct))out.push(direct);
  return out;
}
function suffixScore(a,b){
  const aa=normalizeLegacyPath(a).split('/').filter(Boolean),bb=normalizeLegacyPath(b).split('/').filter(Boolean);
  let i=aa.length-1,j=bb.length-1,n=0;
  while(i>=0&&j>=0&&aa[i]===bb[j]){n++;i--;j--}
  return n;
}
function bestLegacySuffixScore(legacyPath,relativePath){
  const variants=legacyPathVariants(legacyPath);
  return variants.reduce((best,v)=>Math.max(best,suffixScore(v,relativePath)),0);
}
function collectLegacyAttachments(){
  const out=[];
  for(const c of state.cases||[]){
    const push=(a,where)=>{if(a?.legacyPath)out.push({attachment:a,caseId:c.id,sheet:c.sheet,title:c.title,where})};
    (c.attachments||[]).forEach(a=>push(a,'ANOMALIA'));
    (c.solution?.attachments||[]).forEach(a=>push(a,'SOLUZIONE'));
    (c.updates||[]).forEach(u=>(u.attachments||[]).forEach(a=>push(a,`RIUNIONE ${fmtDate(u.date)}`)));
  }
  return out;
}
function analyzeLegacyFolder(files){
  legacySourceFiles=Array.from(files||[]);
  const indexed=legacySourceFiles.map((file,i)=>({
    file,i,
    rel:file.webkitRelativePath||file.name,
    name:cleanFileName(file.name),
    relNorm:normalizeLegacyPath(file.webkitRelativePath||file.name)
  }));
  const refs=collectLegacyAttachments();
  legacyMatches=refs.map(ref=>{
    const a=ref.attachment;
    if(a.live||a.storageKey)return {...ref,status:'live',file:null,reason:'Già migrato'};

    const names=legacyFileNames(a.legacyPath||a.name);
    let candidates=indexed.filter(x=>names.includes(x.name));
    if(!candidates.length){
      return {...ref,status:'missing',file:null,reason:`File non trovato${names.length?' · cercato: '+names.join(' / '):''}`};
    }
    if(candidates.length===1){
      const x=candidates[0];
      if(x.file.size>15*1024*1024)return {...ref,status:'missing',file:null,reason:'File oltre 15 MB'};
      return {...ref,status:'ok',file:x.file,relativePath:x.rel,reason:'Nome file univoco (formato Access normalizzato)'};
    }

    const ranked=candidates
      .map(x=>({...x,score:bestLegacySuffixScore(a.legacyPath,x.rel)}))
      .sort((x,y)=>y.score-x.score||x.rel.localeCompare(y.rel));
    if(ranked[0].score>ranked[1].score && ranked[0].score>=2){
      const x=ranked[0];
      if(x.file.size>15*1024*1024)return {...ref,status:'missing',file:null,reason:'File oltre 15 MB'};
      return {...ref,status:'ok',file:x.file,relativePath:x.rel,reason:'Percorso storico compatibile'};
    }
    return {...ref,status:'ambiguous',file:null,reason:`${candidates.length} file con lo stesso nome`};
  });
  renderMigration();
}

async function migrateCertainLegacyFiles(){

  const btn=document.getElementById('migrateCertainBtn'),wrap=document.getElementById('migrationProgressWrap'),bar=document.getElementById('migrationProgressBar'),text=document.getElementById('migrationProgressText');
  if(btn)btn.disabled=true;if(wrap)wrap.style.display='block';
  const affected=new Set();let done=0,errors=[];

    try{
      const fd=new FormData();fd.append('file',job.file,job.file.name);
      await api('/api/attachments/'+encodeURIComponent(job.attachment.id)+'/migrate',{method:'POST',body:fd});

    done++;const pct=Math.round(done/jobs.length*100);if(bar)bar.style.width=pct+'%';if(text)text.textContent=`${done}/${jobs.length} elaborati`;
  }
  for(const caseId of affected){try{await reloadCase(caseId)}catch{}}
  analyzeLegacyFolder(legacySourceFiles);
  if(errors.length)alert(`Migrazione completata con ${errors.length} errore/i. Gli allegati riusciti sono già disponibili.\n\n`+errors.slice(0,8).join('\n'));
  else toast(`${done} allegati storici migrati`);
}

      <div class="field"><label>Sales deterrent</label><select id="esSales"><option value="1" ${Number(c.sales)===1?'selected':''}>Cliente insoddisfatto — 1</option><option value="3" ${Number(c.sales)===3?'selected':''}>Cliente estremamente insoddisfatto — 3</option><option value="5" ${Number(c.sales)===5?'selected':''}>Cliente vuole cambiare la macchina — 5</option><option value="7" ${Number(c.sales)===7?'selected':''}>Cliente a rischio di causa legale — 7</option><option value="10" ${Number(c.sales)===10?'selected':''}>Causa legale in corso — 10</option></select></div>
      <div class="field"><label>Costi garanzia (€)</label><input type="number" min="0" step="0.01" id="esWarranty" value="${currentWarranty}"></div>
      <div class="field"><label>Urgenza</label><select id="esUrgency"><option value="1" ${Number(c.urgency)===1?'selected':''}>Non urgente — 1</option><option value="3" ${Number(c.urgency)===3?'selected':''}>Mediamente urgente — 3</option><option value="5" ${Number(c.urgency)===5?'selected':''}>Molto urgente — 5</option><option value="10" ${Number(c.urgency)===10?'selected':''}>Prioritario — 10</option></select></div>
      <div class="field"><label>Anzianità caso</label><input type="number" id="esAge" value="${currentAge}" readonly><div class="hint">Automatico: +1 punto per ogni mese completo.</div></div>
      <div class="field"><label>Bonus manuale</label><input type="number" min="0" max="50" id="esBonus" value="${Number(c.bonus)||0}"></div>
      <div class="field full"><label>Motivazione bonus</label><input id="esBonusReason" value="${esc(c.bonusReason||'')}"></div>
    </div>
    <div style="margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;gap:12px"><b>Totale calcolato</b><strong id="esTotal" style="font-size:24px;color:var(--blue)">${total(c)}</strong></div>
  </div>`;
  openModal('Modifica punteggio',body,async close=>{
    const freq=Math.max(0,Number(document.getElementById('esFreq').value)||0);
    const warranty=Math.max(0,Number(document.getElementById('esWarranty').value)||0);
    const bonus=Math.max(0,Math.min(50,Number(document.getElementById('esBonus').value)||0));
    const draft={...c,
      frequencyCases:freq,
      frequencyScoreStored:freqScore(freq),
      safety:Number(document.getElementById('esSafety').value)||0,
      sales:Number(document.getElementById('esSales').value)||0,
      warrantyCost:warranty,
      warrantyScoreStored:warrantyScore(warranty),
      urgency:Number(document.getElementById('esUrgency').value)||0,
      bonus,
      bonusReason:document.getElementById('esBonusReason').value.trim()
    };
    draft.ageScore=ageScoreForCase(draft);
    try{
      const raw=await api('/api/cases/'+encodeURIComponent(c.id),{method:'PUT',body:JSON.stringify(casePayload(draft))});
      const mapped=mapCase(raw);
      const i=state.cases.findIndex(x=>String(x.id)===String(c.id));
      if(i>=0)state.cases[i]=mapped;
      save();close();renderCase(c.id);toast('Punteggio aggiornato');
    }catch(e){alert('Errore aggiornamento punteggio: '+e.message)}
  });
  const recalc=()=>{
    const freq=Math.max(0,Number(document.getElementById('esFreq')?.value)||0);
    const warranty=Math.max(0,Number(document.getElementById('esWarranty')?.value)||0);
    const safety=Number(document.getElementById('esSafety')?.value)||0;
    const sales=Number(document.getElementById('esSales')?.value)||0;
    const urgency=Number(document.getElementById('esUrgency')?.value)||0;
    const bonus=Math.max(0,Math.min(50,Number(document.getElementById('esBonus')?.value)||0));
    const age=ageScoreForCase(c);
    const score=freqScore(freq)+safety+sales+warrantyScore(warranty)+urgency+age+bonus;
    const el=document.getElementById('esTotal');if(el)el.textContent=score;
  };
  ['esFreq','esSafety','esSales','esWarranty','esUrgency','esBonus'].forEach(id=>{const el=document.getElementById(id);if(el){el.addEventListener('input',recalc);el.addEventListener('change',recalc)}});
  recalc();
}

function openEditCase(c){
const body=`<div class="form-grid">
<div class="field"><label>Scheda</label><input id="eSheet" value="${esc(c.sheet)}"></div>
<div class="field"><label>Stato</label><select id="eStatus"><option value="open" ${c.status==='open'?'selected':''}>Aperto</option><option value="suspended" ${c.status==='suspended'?'selected':''}>Sospeso</option><option value="closed" ${c.status==='closed'?'selected':''}>Risolto</option></select></div>
<div class="field" id="eClosedAtWrap" style="display:${c.status==='closed'?'flex':'none'}"><label>Data chiusura</label><input type="date" id="eClosedAt" value="${esc(c.closedAt||'')}"><div class="hint">Usata anche per congelare il punteggio di anzianità.</div><div class="close-approval-box"><label class="solution-approval-check"><input type="checkbox" id="eSolutionApproved" ${c.status==='closed'?'checked':''}> Soluzione approvata</label><div class="hint">Conferma obbligatoria per chiudere il caso.</div></div></div>
<div class="field"><label>Numero casi / frequenza</label><input type="number" min="0" id="eFreq" value="${Number(c.frequencyCases)||0}"><div class="hint">Aggiorna anche il punteggio Frequenza.</div></div>
<div class="field full"><label>ANOMALIA</label><input id="eTitle" value="${esc(c.title)}"></div>
<div class="field full"><label>Descrizione</label><textarea id="eDesc">${esc(c.description||'')}</textarea></div>
<div class="field"><label>Ente responsabile</label><select id="eEntity"><option value="">—</option>${ENTITIES.map(x=>`<option ${x===c.entity?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
<div class="field"><label>Categoria</label><select id="eCategory"><option value="">—</option><option value="Riparativa" ${categoryLabel(c.category)==='Riparativa'?'selected':''}>Riparativa</option><option value="Service" ${categoryLabel(c.category)==='Service'?'selected':''}>Service</option></select></div>
<div class="field full"><label>Modelli coinvolti</label>${modelEditListHtml(c.models||[])}<div class="hint">Seleziona o deseleziona direttamente i modelli da associare al caso.</div></div>
</div>
<div class="form-section"><div class="form-title">Ricambi coinvolti</div>${partsEditor('editParts',false)}</div>
<div class="form-section"><div class="form-title">Aggiungi allegati ANOMALIA</div><input type="file" id="eFiles" multiple><div class="hint">Massimo 15 MB per file.</div></div>`;
openModal('Modifica caso',body,async close=>{
const models=getEditModels();
if(!document.getElementById('eSheet').value.trim()){alert('Compila il campo Scheda.');return}
if(!document.getElementById('eTitle').value.trim()){alert('Compila il campo ANOMALIA.');return}
if(!models.length){alert('Seleziona almeno un modello coinvolto.');return}
const nextStatus=document.getElementById('eStatus').value;let nextClosedAt=null;
if(nextStatus==='closed'){
if(!String(ensureSolution(c).text||'').trim()){alert('Prima di chiudere il caso inserisci la soluzione.');return}
const approval=document.getElementById('eSolutionApproved');if(!approval?.checked){alert('Conferma che la soluzione è stata approvata prima di chiudere il caso.');return}
nextClosedAt=document.getElementById('eClosedAt').value;if(!nextClosedAt){alert('Inserisci la Data chiusura per un caso Risolto.');return}
const today=localDateISO();if(c.date&&nextClosedAt<c.date){alert('La Data chiusura non può essere precedente alla Data apertura.');return}if(nextClosedAt>today){alert('La Data chiusura non può essere futura.');return}
}
const files=document.getElementById('eFiles').files;if(!validateFiles15MB(files))return;
const freq=Math.max(0,Number(document.getElementById('eFreq').value)||0);
const draft={...c,sheet:document.getElementById('eSheet').value.trim(),status:nextStatus,closedAt:nextStatus==='closed'?nextClosedAt:null,title:document.getElementById('eTitle').value.trim(),description:document.getElementById('eDesc').value.trim(),entity:document.getElementById('eEntity').value,category:document.getElementById('eCategory').value,models:[...models],frequencyCases:freq,frequencyScoreStored:freqScore(freq),parts:collectParts('editParts',false)};
draft.ageScore=nextStatus==='closed'?ageScoreFromDate(draft.date,draft.closedAt):ageScoreFromDate(draft.date);
try{const raw=await api('/api/cases/'+encodeURIComponent(c.id),{method:'PUT',body:JSON.stringify(casePayload(draft))});let mapped=mapCase(raw);state.cases[state.cases.findIndex(x=>String(x.id)===String(c.id))]=mapped;if(files.length){try{await uploadFiles(c.id,files,'anomaly');mapped=await reloadCase(c.id)}catch(upErr){alert('Caso aggiornato, ma uno o più allegati non sono stati caricati: '+upErr.message)}}save();close();renderCase(c.id);toast('Caso aggiornato')}catch(e){alert('Errore aggiornamento caso: '+e.message)}
});
(c.parts||[]).forEach(p=>addPartRow('editParts',false,p));document.querySelector('[data-add-parts="editParts"]')?.addEventListener('click',()=>addPartRow('editParts',false));
const statusEl=document.getElementById('eStatus'),closedWrap=document.getElementById('eClosedAtWrap'),closedInput=document.getElementById('eClosedAt'),approvalInput=document.getElementById('eSolutionApproved');
const syncClosedDate=()=>{const isClosed=statusEl.value==='closed';closedWrap.style.display=isClosed?'flex':'none';if(isClosed&&!closedInput.value&&c.status!=='closed')closedInput.value=localDateISO();if(!isClosed){closedInput.value='';if(approvalInput)approvalInput.checked=false}};statusEl.addEventListener('change',syncClosedDate);syncClosedDate();
}
function openEditCurrentAction(c){const body=`<div class="form-grid"><div class="field full"><label>Azione corrente</label><textarea id="caText">${esc(c.currentAction?.text||'')}</textarea></div><div class="field"><label>Responsabile</label><select id="caOwner"><option value="">—</option>${ENTITIES.map(x=>`<option ${x===c.currentAction?.owner?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Scadenza</label><input type="date" id="caDue" value="${esc(c.currentAction?.due||'')}"></div><div class="field"><label>Stato azione</label><select id="caStatus">${['Aperta','In attesa','Completata','Chiusa'].map(x=>`<option ${x===c.currentAction?.status?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="hint" style="margin-top:10px">Questa modifica aggiorna l'azione corrente senza creare una nuova nota di riunione.</div>`;openModal('Modifica azione corrente',body,async close=>{const draft={...c,currentAction:{text:document.getElementById('caText').value.trim(),owner:document.getElementById('caOwner').value,due:document.getElementById('caDue').value,status:document.getElementById('caStatus').value}};try{const raw=await api('/api/cases/'+encodeURIComponent(c.id),{method:'PUT',body:JSON.stringify(casePayload(draft))});const mapped=mapCase(raw);const i=state.cases.findIndex(x=>String(x.id)===String(c.id));if(i>=0)state.cases[i]=mapped;save();close();renderCase(c.id);toast('Azione corrente aggiornata')}catch(e){alert('Errore aggiornamento azione: '+e.message)}})}

function openUpdate(c){const body=`<div class="form-grid"><div class="field"><label>Data riunione</label><input type="date" id="uDate" value="${localDateISO()}"></div><div class="field"><label>Stato caso</label><select id="uCaseStatus"><option value="open" ${c.status==='open'?'selected':''}>Aperto</option><option value="suspended" ${c.status==='suspended'?'selected':''}>Sospeso</option><option value="closed" ${c.status==='closed'?'selected':''}>Risolto</option></select></div><div class="field" id="uCloseApprovalWrap" style="display:${c.status==='closed'?'flex':'none'}"><label>Chiusura caso</label><div class="close-approval-box"><label class="solution-approval-check"><input type="checkbox" id="uSolutionApproved" ${c.status==='closed'?'checked':''}> Soluzione approvata</label><div class="hint">Conferma obbligatoria per impostare il caso come Risolto.</div></div></div><div class="field full"><label class="required">Aggiornamento</label><textarea id="uText" placeholder="Cosa è emerso / cosa è stato deciso"></textarea></div><div class="field full"><label>Azione corrente</label><input id="uAction" value="${esc(c.currentAction?.text||'')}"></div><div class="field"><label>Responsabile</label><select id="uOwner"><option value="">—</option>${ENTITIES.map(x=>`<option ${x===c.currentAction?.owner?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Scadenza</label><input type="date" id="uDue" value="${esc(c.currentAction?.due||'')}"></div><div class="field"><label>Stato azione</label><select id="uActionStatus">${['Aperta','In attesa','Completata','Chiusa'].map(x=>`<option ${x===c.currentAction?.status?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="form-section"><div class="form-title">Ricambi discussi / richiesti</div>${partsEditor('updateParts',true)}</div><div class="form-section"><div class="form-title">Allegati aggiornamento</div><input type="file" id="uFiles" multiple></div>`;openModal('Aggiorna riunione',body,async close=>{const txt=document.getElementById('uText').value.trim();if(!txt){alert('Inserisci un aggiornamento prima di salvare.');return}const meetingDate=document.getElementById('uDate').value;if(!meetingDate){alert('Inserisci la Data riunione.');return}const today=localDateISO();if(c.date&&meetingDate<c.date){alert('La Data riunione non può essere precedente alla Data apertura del caso.');return}if(meetingDate>today){alert('La Data riunione non può essere futura.');return}const files=document.getElementById('uFiles').files;if(!validateFiles15MB(files))return;const u={id:crypto.randomUUID(),date:meetingDate,text:txt,action:document.getElementById('uAction').value.trim(),owner:document.getElementById('uOwner').value,due:document.getElementById('uDue').value,status:document.getElementById('uActionStatus').value,parts:collectParts('updateParts',true),attachments:[]};const nextStatus=document.getElementById('uCaseStatus').value;if(nextStatus==='closed'){if(!String(ensureSolution(c).text||'').trim()){alert('Prima di chiudere il caso inserisci la soluzione.');return}const approval=document.getElementById('uSolutionApproved');if(!approval?.checked){alert('Conferma che la soluzione è stata approvata prima di chiudere il caso.');return}}const draft={...c};if(nextStatus==='closed'){draft.closedAt=(c.status==='closed'&&c.closedAt)?c.closedAt:u.date;draft.ageScore=ageScoreFromDate(c.date,draft.closedAt)}else{draft.closedAt=null;draft.ageScore=ageScoreFromDate(c.date)}draft.status=nextStatus;try{const raw=await api('/api/cases/'+encodeURIComponent(c.id)+'/updates',{method:'POST',body:JSON.stringify({id:u.id,meeting_date:u.date,update_text:u.text,action_text:u.action,action_owner:u.owner,action_due:u.due||null,action_status:u.status,parts:apiParts(u.parts,true),update_current_action:true,case_status:draft.status,closed_at:draft.closedAt||null,age_score:draft.ageScore??ageScoreForCase(draft),score:total(draft)})});let mapped=mapCase(raw);state.cases[state.cases.findIndex(x=>String(x.id)===String(c.id))]=mapped;if(files.length){try{await uploadFiles(c.id,files,'update',u.id);mapped=await reloadCase(c.id)}catch(upErr){alert('Aggiornamento salvato, ma uno o più allegati non sono stati caricati: '+upErr.message)}}save();close();renderCase(c.id);toast('Aggiornamento salvato')}catch(e){try{await reloadCase(c.id);renderCase(c.id)}catch{}alert('Errore salvataggio aggiornamento: '+e.message)}});const updateStatusEl=document.getElementById('uCaseStatus'),updateApprovalWrap=document.getElementById('uCloseApprovalWrap'),updateApprovalInput=document.getElementById('uSolutionApproved');const syncUpdateApproval=()=>{const isClosed=updateStatusEl.value==='closed';updateApprovalWrap.style.display=isClosed?'flex':'none';if(!isClosed&&updateApprovalInput)updateApprovalInput.checked=false};updateStatusEl.addEventListener('change',syncUpdateApproval);syncUpdateApproval();document.querySelector('[data-add-parts="updateParts"]').onclick=()=>addPartRow('updateParts',true)}
function openSolution(c){const s=ensureSolution(c);const body=`<div class="form-grid"><div class="field full"><label>Descrizione soluzione</label><textarea id="sText">${esc(s.text||'')}</textarea></div><div class="field"><label>CID</label><input id="sCid" value="${esc(s.cid||'')}" placeholder="es. 30958"></div><div class="field"><label>CUT IN</label><input id="sCutIn" value="${esc(s.cutIn||'')}" placeholder="es. VIN / data / riferimento introduzione"></div></div><div class="form-section"><div class="form-title">Ricambi SOLUZIONE</div>${partsEditor('solutionParts',true)}</div><div class="form-section"><div class="form-title">Allegati SOLUZIONE</div><input type="file" id="sFiles" multiple><div class="hint">Gli allegati esistenti non vengono rimossi; puoi eliminarli direttamente dalla scheda.</div></div>`;openModal('Modifica soluzione',body,async close=>{const files=document.getElementById('sFiles').files;if(!validateFiles15MB(files))return;const currentSolution=ensureSolution(c);const draft={...c,solution:{...currentSolution,text:document.getElementById('sText').value.trim(),cid:document.getElementById('sCid').value.trim(),cutIn:document.getElementById('sCutIn').value.trim(),parts:collectParts('solutionParts',true),attachments:[...(currentSolution.attachments||[])]}};try{const raw=await api('/api/cases/'+encodeURIComponent(c.id),{method:'PUT',body:JSON.stringify(casePayload(draft))});let mapped=mapCase(raw);state.cases[state.cases.findIndex(x=>String(x.id)===String(c.id))]=mapped;if(files.length){try{await uploadFiles(c.id,files,'solution');mapped=await reloadCase(c.id)}catch(upErr){alert('Soluzione aggiornata, ma uno o più allegati non sono stati caricati: '+upErr.message)}}save();close();renderCase(c.id);toast('Soluzione aggiornata')}catch(e){alert('Errore aggiornamento soluzione: '+e.message)}});(s.parts||[]).forEach(p=>addPartRow('solutionParts',true,p));document.querySelector('[data-add-parts="solutionParts"]').onclick=()=>addPartRow('solutionParts',true)}
document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>setView(n.dataset.view));const mobileMenuBtn=document.getElementById('mobileMenuBtn'),mobileNavBackdrop=document.getElementById('mobileNavBackdrop'),mobileSidebar=document.querySelector('.sidebar');if(mobileMenuBtn){mobileMenuBtn.onclick=()=>{const open=!mobileSidebar.classList.contains('mobile-open');mobileSidebar.classList.toggle('mobile-open',open);mobileNavBackdrop.classList.toggle('show',open);document.body.classList.toggle('mobile-nav-open',open);mobileMenuBtn.setAttribute('aria-expanded',open?'true':'false')}}if(mobileNavBackdrop)mobileNavBackdrop.onclick=closeMobileNav;window.addEventListener('resize',()=>{if(window.innerWidth>700)closeMobileNav()});document.getElementById('homeTop').onclick=()=>setView('agenda');document.getElementById('newCaseTop').onclick=openNewCase;loadFromApi().catch(e=>{document.getElementById('app').innerHTML=`<div class="card"><h2>Connessione D1 non riuscita</h2><p>${esc(e.message)}</p><button class="btn btn-blue" onclick="location.reload()">Riprova</button></div>`;});
})();
</script>
