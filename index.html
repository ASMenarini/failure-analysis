<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MENARINI — Failure Analysis</title>
<style>
:root{--blue:#0b4f8a;--blue2:#0a3f70;--bg:#f3f6f9;--card:#fff;--text:#17212b;--muted:#667788;--line:#dce4ec;--danger:#b42318;--warn:#b54708;--ok:#067647;--shadow:0 8px 24px rgba(0,0,0,.08)}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.topbar{height:72px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.brand{display:flex;align-items:center;gap:16px}.brand-badge{font-weight:800;font-size:22px;letter-spacing:.8px}.brand-title{font-size:16px;opacity:.9;border-left:1px solid rgba(255,255,255,.35);padding-left:16px}
.top-actions{display:flex;gap:10px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700}.btn-primary{background:#fff;color:var(--blue)}.btn-blue{background:var(--blue);color:#fff}.btn-soft{background:#eaf2f9;color:var(--blue)}.btn-ghost{background:transparent;color:inherit;border:1px solid var(--line)}.btn-danger{background:#fee4e2;color:var(--danger)}.btn-sm{padding:7px 10px;font-size:13px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 14px}.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;margin-bottom:6px;color:#334454;font-weight:700;cursor:pointer}.nav-item:hover,.nav-item.active{background:#eaf2f9;color:var(--blue)}.nav-count{margin-left:auto;background:#eef2f6;border-radius:20px;padding:2px 7px;font-size:12px}
.main{padding:24px 28px;min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}.page-title{font-size:28px;font-weight:800;margin:0}.sub{color:var(--muted);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.kpi strong{font-size:26px;display:block}.kpi span{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}.toolbar input{min-width:280px;flex:1}
.table-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 14px;border-bottom:1px solid #edf1f5;text-align:left;font-size:14px}.table th{background:#f8fafc;color:#536273;font-size:12px;text-transform:uppercase;letter-spacing:.4px}.table tbody tr:hover{background:#f8fbfe}.clickable{cursor:pointer}.score-pill{display:inline-flex;min-width:42px;justify-content:center;padding:5px 8px;border-radius:16px;background:#eaf2f9;color:var(--blue);font-weight:800}.status{display:inline-flex;padding:5px 9px;border-radius:16px;font-size:12px;font-weight:800}.open{background:#fee4e2;color:#b42318}.suspended{background:#fff0c2;color:#8a5b00}.closed{background:#d1fadf;color:#067647}.trash{background:#f2f4f7;color:#475467}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 1px 0 rgba(0,0,0,.02)}.section-title{font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:#445465;font-weight:800;margin:0 0 12px}.muted{color:var(--muted)}
.case-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}.case-main{display:flex;flex-direction:column;gap:14px}.case-side{position:sticky;top:94px;display:flex;flex-direction:column;gap:14px}.case-header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.case-id{font-size:14px;color:var(--muted);font-weight:700}.case-title{font-size:26px;font-weight:800;margin:5px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.meta{background:#f8fafc;border:1px solid #edf1f5;border-radius:9px;padding:10px}.meta b{display:block;font-size:12px;color:#667788;margin-bottom:4px}.parts-table{width:100%;border-collapse:collapse}.parts-table td,.parts-table th{border-bottom:1px solid #edf1f5;padding:8px 6px;text-align:left;font-size:13px}
.attach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.attachment{border:1px solid var(--line);border-radius:10px;background:#fafbfd;overflow:hidden}.attachment img{width:100%;height:140px;object-fit:cover;display:block;background:#eef2f6}.attachment-body{padding:10px}.attachment-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-tools{display:flex;gap:6px;margin-top:8px}.file-icon{height:140px;display:grid;place-items:center;font-size:40px;background:#eef2f6;color:#5d6c7a}
.current-action{border-left:4px solid var(--blue);padding-left:14px}.action-row{display:grid;grid-template-columns:1.4fr .9fr .7fr .6fr;gap:10px;margin-top:10px}.tag{display:inline-flex;padding:4px 8px;border-radius:15px;background:#eef4f8;font-size:12px;font-weight:700}
.timeline{display:flex;flex-direction:column;gap:12px}.timeline-item{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}.timeline-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.timeline-date{font-weight:800;color:var(--blue)}.timeline-text{white-space:pre-wrap;line-height:1.45}.timeline-extra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.timeline-box{background:#f8fafc;border-radius:8px;padding:8px;font-size:13px}.timeline-box b{display:block;font-size:11px;color:#667788;margin-bottom:3px;text-transform:uppercase}
.score-card{padding:14px}.score-total{text-align:center;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:8px}.score-total strong{font-size:32px;color:var(--blue)}.score-list{display:flex;flex-direction:column;gap:7px}.score-row{display:flex;justify-content:space-between;gap:10px;font-size:12px}.score-row span:first-child{color:#657586}.score-row b{font-size:13px}.bonus-note{font-size:11px;color:#7a5b00;background:#fff8db;padding:7px;border-radius:7px;margin-top:7px}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,25,40,.5);display:none;align-items:flex-start;justify-content:center;padding:50px 20px;z-index:100;overflow:auto}.modal-backdrop.show{display:flex}.modal{width:min(980px,100%);background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:21px}.modal-body{padding:20px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line);background:#fafbfd}.x{border:0;background:transparent;font-size:24px;color:#697586}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#526273;text-transform:uppercase}.field input,.field select,.field textarea{border:1px solid #cfd9e3;border-radius:8px;padding:10px;background:#fff}.field textarea{min-height:95px;resize:vertical}.hint{font-size:12px;color:var(--muted)}.required:after{content:' *';color:#d92d20}.form-section{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.form-section:first-child{border-top:0;padding-top:0;margin-top:0}.form-title{font-weight:800;margin-bottom:10px;color:#324252}.inline-row{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;margin-bottom:8px}.inline-row.qty{grid-template-columns:1fr 1.5fr .6fr auto}.multi-wrap{position:relative}.multi-button{width:100%;text-align:left;border:1px solid #cfd9e3;background:#fff;border-radius:8px;padding:10px;min-height:41px}.multi-panel{display:none;position:absolute;left:0;right:0;top:45px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px;z-index:5;max-height:220px;overflow:auto}.multi-panel.show{display:block}.multi-option{display:flex;gap:8px;padding:6px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{background:#edf4fa;border-radius:14px;padding:4px 8px;font-size:12px}.empty{padding:35px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;background:#17212b;color:#fff;padding:12px 15px;border-radius:9px;z-index:200;display:none}.toast.show{display:block}.danger-zone{border:1px solid #fecdca;background:#fff6f5}.danger-zone .section-title{color:var(--danger)}
@media(max-width:1050px){.shell{grid-template-columns:1fr}.sidebar{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.case-layout{grid-template-columns:1fr}.case-side{position:static}.meta-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.main{padding:16px}.topbar{padding:0 15px}.brand-title{display:none}.form-grid,.grid-2,.meta-grid,.action-row,.timeline-extra{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.table-card{overflow:auto}.toolbar input{min-width:100%}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-badge">MENARINI</div><div class="brand-title">FAILURE ANALYSIS</div></div>
  <div class="top-actions"><button class="btn btn-primary" id="newCaseTop">+ Nuovo caso</button></div>
</header>
<div class="shell">
  <aside class="sidebar">
    <div class="nav-item active" data-view="agenda">Agenda riunione <span class="nav-count" id="navOpen">0</span></div>
    <div class="nav-item" data-view="cases">Tutti i casi</div>
    <div class="nav-item" data-view="actions">Azioni aperte <span class="nav-count" id="navActions">0</span></div>
    <div class="nav-item" data-view="meetings">Riunioni</div>
    <div class="nav-item" data-view="trash">Cestino <span class="nav-count" id="navTrash">0</span></div>
  </aside>
  <main class="main" id="app"></main>
</div>
<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const MODELS=['Citymood 10','Citymood 12','Citymood 12E','Citymood 18','Citymood 18E','Avancity+ 10','Avancity+ 12','Vivacity','BEV 10','BEV 12'];
const ENTITIES=['Engineering','Quality','After Sales','Production','Supplier Quality','Purchasing','R&D','Service','Electrical','Body'];
const CATEGORIES=['Meccanica','Elettrica','HVAC','Carrozzeria','Software','Porte','Freni','Trazione','Altro'];
const STORE_KEY='menarini_failure_analysis_v1';
const sample={
 cases:[
  {id:'1',sheet:'305',title:'Rumorosità compressore A/C',status:'open',date:'2026-08-19',models:['Citymood 12'],entity:'Quality',category:'HVAC',description:'Rumorosità anomala del compressore A/C dopo alcune ore di esercizio.',parts:[{pn:'AC-44721',desc:'Compressore A/C'}],attachments:[],frequencyCases:17,safety:5,sales:4,warrantyCost:4800,urgency:7,bonus:3,bonusReason:'Cliente strategico coinvolto',currentAction:{text:'Analisi componente restituito',owner:'Supplier Quality',due:'2026-09-09',status:'Aperta'},solution:{text:'',parts:[],attachments:[]},updates:[{id:'u1',date:'2026-09-02',text:'Prova effettuata sul veicolo 2431. Anomalia riprodotta e componente inviato al fornitore.',action:'Analizzare componente restituito',owner:'Supplier Quality',due:'2026-09-09',status:'Aperta',parts:[{pn:'AC-44721',desc:'Compressore A/C',qty:1}],attachments:[]}],deletedAt:null},
  {id:'2',sheet:'304',title:'Malfunzionamento porta posteriore',status:'suspended',date:'2026-08-11',models:['Citymood 10','Citymood 12'],entity:'Engineering',category:'Porte',description:'Apertura intermittente della porta posteriore in condizioni di pioggia.',parts:[{pn:'PT-99210',desc:'Sensore porta'}],attachments:[],frequencyCases:9,safety:6,sales:5,warrantyCost:2600,urgency:5,bonus:0,bonusReason:'',currentAction:{text:'Attesa nuovo sensore dal fornitore',owner:'Purchasing',due:'2026-09-15',status:'In attesa'},solution:{text:'',parts:[],attachments:[]},updates:[{id:'u2',date:'2026-08-26',text:'Test comparativo completato. Il sensore presenta infiltrazioni.',action:'Richiedere campioni modificati',owner:'Purchasing',due:'2026-09-15',status:'In attesa',parts:[],attachments:[]}],deletedAt:null},
  {id:'3',sheet:'287',title:'Errore inverter trazione',status:'closed',date:'2026-06-02',models:['BEV 12'],entity:'Electrical',category:'Trazione',description:'Errore sporadico inverter con veicolo fermo.',parts:[],attachments:[],frequencyCases:4,safety:7,sales:3,warrantyCost:1800,urgency:4,bonus:0,bonusReason:'',currentAction:{text:'',owner:'',due:'',status:'Chiusa'},solution:{text:'Aggiornato firmware inverter e sostituito cablaggio su veicoli coinvolti.',parts:[{pn:'INV-CAB-22',desc:'Cablaggio inverter',qty:1}],attachments:[]},updates:[{id:'u3',date:'2026-07-08',text:'Validazione conclusa con esito positivo. Caso chiuso.',action:'',owner:'Electrical',due:'',status:'Chiusa',parts:[],attachments:[]}],deletedAt:null}
 ], meetings:[]
};
let state=load(); let currentView='agenda'; let currentCaseId=null;
function load(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||structuredClone(sample)}catch(e){return structuredClone(sample)}}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state)); refreshCounts()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(d){if(!d)return '—'; const x=new Date(d+'T00:00:00'); return isNaN(x)?d:x.toLocaleDateString('it-IT')}
function freqScore(n){n=Number(n)||0; if(n<5)return 1;if(n<=10)return 2;if(n<=15)return 3;if(n<=20)return 4;if(n<=25)return 5;if(n<=30)return 6;if(n<=35)return 7;if(n<=40)return 8;if(n<=45)return 9;return 10}
function warrantyScore(v){v=Number(v)||0;if(v<1000)return 1;if(v<2500)return 2;if(v<5000)return 4;if(v<10000)return 6;if(v<20000)return 8;return 10}
function total(c){return freqScore(c.frequencyCases)+(Number(c.safety)||0)+(Number(c.sales)||0)+warrantyScore(c.warrantyCost)+(Number(c.urgency)||0)+(Number(c.bonus)||0)}
function activeCases(){return state.cases.filter(c=>!c.deletedAt)}
function trashedCases(){return state.cases.filter(c=>c.deletedAt)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function refreshCounts(){document.getElementById('navOpen').textContent=activeCases().filter(c=>c.status==='open').length;document.getElementById('navTrash').textContent=trashedCases().length;document.getElementById('navActions').textContent=activeCases().filter(c=>c.currentAction&&c.currentAction.text&&c.currentAction.status!=='Chiusa').length}
function setView(v){currentView=v;currentCaseId=null;document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===v));render()}
function statusLabel(s){return s==='open'?'Aperto':s==='suspended'?'Sospeso':'Risolto'}
function statusClass(s){return s==='open'?'open':s==='suspended'?'suspended':'closed'}
function render(){if(currentCaseId){renderCase(currentCaseId);return} if(currentView==='agenda'||currentView==='cases')renderList(); else if(currentView==='actions')renderActions(); else if(currentView==='meetings')renderMeetings(); else renderTrash();}
function renderList(){const all=activeCases();const opens=all.filter(c=>c.status==='open').length,susp=all.filter(c=>c.status==='suspended').length,closed=all.filter(c=>c.status==='closed').length;const rows=[...all].sort((a,b)=> currentView==='agenda'?total(b)-total(a):Number(b.sheet)-Number(a.sheet));
 document.getElementById('app').innerHTML=`<div class="page-head"><div><h1 class="page-title">${currentView==='agenda'?'Agenda Failure Analysis':'Archivio casi'}</h1><div class="sub">${currentView==='agenda'?'Casi ordinati automaticamente per TOTALONE':'Tutti i casi, compresi sospesi e risolti'}</div></div><button class="btn btn-blue" id="newCaseBtn">+ Nuovo caso</button></div>
 <div class="kpis"><div class="kpi"><strong>${all.length}</strong><span>Totale casi</span></div><div class="kpi"><strong>${opens}</strong><span>Aperti</span></div><div class="kpi"><strong>${susp}</strong><span>Sospesi</span></div><div class="kpi"><strong>${closed}</strong><span>Risolti</span></div><div class="kpi"><strong>${trashedCases().length}</strong><span>Nel cestino</span></div></div>
 <div class="toolbar"><input id="search" placeholder="Cerca scheda, anomalia, modello, ente…"><select id="statusFilter"><option value="">Tutti gli stati</option><option value="open">Aperti</option><option value="suspended">Sospesi</option><option value="closed">Risolti</option></select><select id="modelFilter"><option value="">Tutti i modelli</option>${MODELS.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div>
 <div class="table-card"><table class="table"><thead><tr><th>Priorità</th><th>Scheda</th><th>ANOMALIA</th><th>Modelli</th><th>Ente</th><th>Azione corrente</th><th>Stato</th></tr></thead><tbody id="caseRows"></tbody></table></div>`;
 const draw=()=>{const q=document.getElementById('search').value.toLowerCase(),sf=document.getElementById('statusFilter').value,mf=document.getElementById('modelFilter').value;const rr=rows.filter(c=>(!sf||c.status===sf)&&(!mf||c.models.includes(mf))&&(!q||[c.sheet,c.title,c.description,c.entity,...c.models].join(' ').toLowerCase().includes(q)));document.getElementById('caseRows').innerHTML=rr.length?rr.map(c=>`<tr class="clickable" data-id="${c.id}"><td><span class="score-pill">${total(c)}</span></td><td><b>${esc(c.sheet)}</b></td><td>${esc(c.title)}</td><td>${esc(c.models.join(', '))}</td><td>${esc(c.entity||'—')}</td><td>${esc(c.currentAction?.text||'—')}</td><td><span class="status ${statusClass(c.status)}">${statusLabel(c.status)}</span></td></tr>`).join(''):`<tr><td colspan="7" class="empty">Nessun caso trovato</td></tr>`;document.querySelectorAll('#caseRows tr[data-id]').forEach(r=>r.onclick=()=>{currentCaseId=r.dataset.id;render()})};draw();['search','statusFilter','modelFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',draw));document.getElementById('newCaseBtn').onclick=openNewCase;}
function renderCase(id){const c=state.cases.find(x=>x.id===id);if(!c||c.deletedAt){setView('cases');return}const atts=c.attachments||[], solAtt=c.solution?.attachments||[];
 document.getElementById('app').innerHTML=`<div class="page-head"><div><button class="btn btn-ghost btn-sm" id="backBtn">← Torna</button><div class="case-id" style="margin-top:12px">Scheda ${esc(c.sheet)}</div><h1 class="page-title">${esc(c.title)}</h1></div><div class="actions"><button class="btn btn-soft" id="updateBtn">Aggiorna riunione</button><button class="btn btn-soft" id="solutionBtn">Modifica soluzione</button><button class="btn btn-danger" id="deleteCaseBtn">Elimina caso</button></div></div>
 <div class="case-layout"><div class="case-main">
 <section class="card"><h3 class="section-title">ANOMALIA</h3><div class="meta-grid"><div class="meta"><b>Stato</b><span class="status ${statusClass(c.status)}">${statusLabel(c.status)}</span></div><div class="meta"><b>Data apertura</b>${fmtDate(c.date)}</div><div class="meta"><b>Ente</b>${esc(c.entity||'—')}</div><div class="meta"><b>Categoria</b>${esc(c.category||'—')}</div><div class="meta"><b>Modelli</b>${esc(c.models.join(', ')||'—')}</div><div class="meta"><b>Casi rilevati</b>${Number(c.frequencyCases)||0}</div></div><p style="line-height:1.55">${esc(c.description||'—')}</p>${renderParts(c.parts,false)}<div style="margin-top:14px"><b>Allegati ANOMALIA</b>${renderAttachments(atts,'anomaly',c.id)}</div></section>
 <section class="card current-action"><h3 class="section-title">Azione corrente</h3>${c.currentAction?.text?`<div style="font-size:18px;font-weight:800">${esc(c.currentAction.text)}</div><div class="action-row"><div><span class="muted">Responsabile</span><br><b>${esc(c.currentAction.owner||'—')}</b></div><div><span class="muted">Scadenza</span><br><b>${fmtDate(c.currentAction.due)}</b></div><div><span class="muted">Stato</span><br><span class="tag">${esc(c.currentAction.status||'—')}</span></div></div>`:`<div class="muted">Nessuna azione corrente.</div>`}</section>
 <section class="card"><h3 class="section-title">SOLUZIONE</h3>${c.solution?.text?`<p style="line-height:1.55">${esc(c.solution.text)}</p>${renderParts(c.solution.parts,true)}`:`<div class="muted">Soluzione non ancora definita.</div>`}<div style="margin-top:14px"><b>Allegati SOLUZIONE</b>${renderAttachments(solAtt,'solution',c.id)}</div></section>
 <section class="card"><h3 class="section-title">Storico riunioni</h3>${renderTimeline(c)}</section>
 <section class="card danger-zone"><h3 class="section-title">Zona eliminazione</h3><div class="muted" style="margin-bottom:10px">Il caso viene spostato nel Cestino e può essere ripristinato.</div><button class="btn btn-danger" id="deleteCaseBottom">Sposta caso nel Cestino</button></section>
 </div><aside class="case-side"><section class="card score-card"><h3 class="section-title">Scoring</h3><div class="score-total"><div class="muted">TOTALONE</div><strong>${total(c)}</strong></div><div class="score-list"><div class="score-row"><span>Frequenza (${c.frequencyCases||0})</span><b>${freqScore(c.frequencyCases)}</b></div><div class="score-row"><span>Sicurezza</span><b>${c.safety||0}</b></div><div class="score-row"><span>Sales deterrent</span><b>${c.sales||0}</b></div><div class="score-row"><span>Costi garanzia (€ ${Number(c.warrantyCost||0).toLocaleString('it-IT')})</span><b>${warrantyScore(c.warrantyCost)}</b></div><div class="score-row"><span>Urgenza</span><b>${c.urgency||0}</b></div><div class="score-row"><span>Bonus manuale</span><b>+${c.bonus||0}</b></div></div>${c.bonusReason?`<div class="bonus-note">${esc(c.bonusReason)}</div>`:''}</section></aside></div>`;
 document.getElementById('backBtn').onclick=()=>{currentCaseId=null;render()};document.getElementById('updateBtn').onclick=()=>openUpdate(c);document.getElementById('solutionBtn').onclick=()=>openSolution(c);document.getElementById('deleteCaseBtn').onclick=()=>moveToTrash(c.id);document.getElementById('deleteCaseBottom').onclick=()=>moveToTrash(c.id);bindAttachmentButtons();}
function renderParts(parts=[],qty){if(!parts.length)return '<div class="muted" style="margin-top:10px">Nessun ricambio indicato.</div>';return `<div style="margin-top:12px"><b>Ricambi</b><table class="parts-table"><thead><tr><th>Part Number</th><th>Descrizione</th>${qty?'<th>Q.tà</th>':''}</tr></thead><tbody>${parts.map(p=>`<tr><td>${esc(p.pn||'—')}</td><td>${esc(p.desc||'—')}</td>${qty?`<td>${esc(p.qty||'—')}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function renderAttachments(arr=[],kind,caseId){if(!arr.length)return '<div class="muted" style="margin-top:8px">Nessun allegato.</div>';return `<div class="attach-grid" style="margin-top:8px">${arr.map(a=>`<div class="attachment">${a.type?.startsWith('image/')&&a.dataUrl?`<img src="${a.dataUrl}" alt="${esc(a.name)}">`:`<div class="file-icon">📎</div>`}<div class="attachment-body"><div class="attachment-name" title="${esc(a.name)}">${esc(a.name)}</div><div class="attachment-tools">${a.dataUrl?`<a class="btn btn-soft btn-sm" href="${a.dataUrl}" target="_blank" rel="noopener">Apri</a>`:''}${a.dataUrl?`<a class="btn btn-ghost btn-sm" href="${a.dataUrl}" download="${esc(a.name)}">Scarica</a>`:''}<button class="btn btn-danger btn-sm delete-attachment" data-case="${caseId}" data-kind="${kind}" data-att="${a.id}">Elimina</button></div></div></div>`).join('')}</div>`}
function bindAttachmentButtons(){document.querySelectorAll('.delete-attachment').forEach(b=>b.onclick=()=>deleteAttachment(b.dataset.case,b.dataset.kind,b.dataset.att))}
function renderTimeline(c){const u=[...(c.updates||[])].reverse();if(!u.length)return '<div class="muted">Nessun aggiornamento registrato.</div>';return `<div class="timeline">${u.map(x=>`<div class="timeline-item"><div class="timeline-head"><div class="timeline-date">${fmtDate(x.date)}</div><span class="tag">${esc(x.status||'Aggiornamento')}</span></div><div class="timeline-text">${esc(x.text||'')}</div>${x.action||x.owner||x.due?`<div class="timeline-extra"><div class="timeline-box"><b>Azione decisa</b>${esc(x.action||'—')}</div><div class="timeline-box"><b>Responsabile</b>${esc(x.owner||'—')}</div><div class="timeline-box"><b>Scadenza</b>${fmtDate(x.due)}</div></div>`:''}${renderParts(x.parts||[],true)}${x.attachments?.length?`<div style="margin-top:10px"><b>Allegati della riunione</b>${renderAttachments(x.attachments,'update:'+x.id,c.id)}</div>`:''}</div>`).join('')}</div>`}
function renderActions(){const a=activeCases().filter(c=>c.currentAction?.text&&c.currentAction.status!=='Chiusa').sort((x,y)=>(x.currentAction.due||'9999').localeCompare(y.currentAction.due||'9999'));document.getElementById('app').innerHTML=`<div class="page-head"><div><h1 class="page-title">Azioni aperte</h1><div class="sub">Attività operative emerse dalle riunioni</div></div></div><div class="table-card"><table class="table"><thead><tr><th>Scheda</th><th>ANOMALIA</th><th>Azione</th><th>Responsabile</th><th>Scadenza</th><th>Stato</th></tr></thead><tbody>${a.length?a.map(c=>`<tr class="clickable" data-id="${c.id}"><td><b>${esc(c.sheet)}</b></td><td>${esc(c.title)}</td><td>${esc(c.currentAction.text)}</td><td>${esc(c.currentAction.owner||'—')}</td><td>${fmtDate(c.currentAction.due)}</td><td>${esc(c.currentAction.status)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">Nessuna azione aperta</td></tr>`}</tbody></table></div>`;document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>{currentCaseId=r.dataset.id;render()})}
function renderMeetings(){document.getElementById('app').innerHTML=`<div class="page-head"><div><h1 class="page-title">Riunioni Failure Analysis</h1><div class="sub">Gli snapshot verranno creati automaticamente quando salveremo una riunione.</div></div><button class="btn btn-blue" id="snapshotBtn">Crea snapshot adesso</button></div><div class="card">${state.meetings.length?state.meetings.slice().reverse().map(m=>`<div class="timeline-item"><div class="timeline-date">${fmtDate(m.date)}</div><div>${m.caseCount} casi · ${m.openCount} aperti · ${m.suspendedCount} sospesi · ${m.closedCount} risolti</div></div>`).join(''):'<div class="empty">Nessuna riunione salvata.</div>'}</div>`;document.getElementById('snapshotBtn').onclick=()=>{const cs=activeCases();state.meetings.push({id:crypto.randomUUID(),date:new Date().toISOString().slice(0,10),caseCount:cs.length,openCount:cs.filter(c=>c.status==='open').length,suspendedCount:cs.filter(c=>c.status==='suspended').length,closedCount:cs.filter(c=>c.status==='closed').length});save();render();toast('Snapshot riunione salvato')}}
function renderTrash(){const a=trashedCases();document.getElementById('app').innerHTML=`<div class="page-head"><div><h1 class="page-title">Cestino</h1><div class="sub">I casi possono essere ripristinati oppure eliminati definitivamente.</div></div></div><div class="table-card"><table class="table"><thead><tr><th>Scheda</th><th>ANOMALIA</th><th>Eliminato il</th><th>Azioni</th></tr></thead><tbody>${a.length?a.map(c=>`<tr><td><b>${esc(c.sheet)}</b></td><td>${esc(c.title)}</td><td>${fmtDate(c.deletedAt?.slice(0,10))}</td><td><button class="btn btn-soft btn-sm restore" data-id="${c.id}">Ripristina</button> <button class="btn btn-danger btn-sm purge" data-id="${c.id}">Elimina definitivamente</button></td></tr>`).join(''):`<tr><td colspan="4" class="empty">Il Cestino è vuoto</td></tr>`}</tbody></table></div>`;document.querySelectorAll('.restore').forEach(b=>b.onclick=()=>{const c=state.cases.find(x=>x.id===b.dataset.id);c.deletedAt=null;save();render();toast('Caso ripristinato')});document.querySelectorAll('.purge').forEach(b=>b.onclick=()=>{if(confirm('Eliminare definitivamente questo caso? Questa operazione non è reversibile.')){state.cases=state.cases.filter(x=>x.id!==b.dataset.id);save();render();toast('Caso eliminato definitivamente')}})}
function moveToTrash(id){if(!confirm('Spostare questo caso nel Cestino? Potrai ripristinarlo in seguito.'))return;const c=state.cases.find(x=>x.id===id);c.deletedAt=new Date().toISOString();save();currentCaseId=null;setView('agenda');toast('Caso spostato nel Cestino')}
function deleteAttachment(caseId,kind,attId){if(!confirm('Eliminare questo allegato?'))return;const c=state.cases.find(x=>x.id===caseId);if(kind==='anomaly')c.attachments=(c.attachments||[]).filter(a=>a.id!==attId);else if(kind==='solution')c.solution.attachments=(c.solution.attachments||[]).filter(a=>a.id!==attId);else if(kind.startsWith('update:')){const uid=kind.split(':')[1];const u=(c.updates||[]).find(x=>x.id===uid);if(u)u.attachments=(u.attachments||[]).filter(a=>a.id!==attId)}save();renderCase(caseId);toast('Allegato eliminato')}
function openModal(title,body,onSave,saveLabel='Salva'){const bd=document.getElementById('modalBackdrop');bd.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="x" id="modalX">×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn btn-ghost" id="modalCancel">Annulla</button><button class="btn btn-blue" id="modalSave">${saveLabel}</button></div></div>`;bd.classList.add('show');const close=()=>{bd.classList.remove('show');bd.innerHTML=''};document.getElementById('modalCancel').onclick=close;document.getElementById('modalX').onclick=close;bd.onclick=e=>{if(e.target===bd)close()};const escKey=e=>{if(e.key==='Escape'){close();document.removeEventListener('keydown',escKey)}};document.addEventListener('keydown',escKey);document.getElementById('modalSave').onclick=()=>onSave(close);return {close}}
function modelMultiHtml(selected=[]){return `<div class="multi-wrap"><button type="button" class="multi-button" id="modelMultiBtn">Seleziona modelli…</button><div class="multi-panel" id="modelPanel">${MODELS.map(m=>`<label class="multi-option"><input type="checkbox" value="${esc(m)}" ${selected.includes(m)?'checked':''}> ${esc(m)}</label>`).join('')}</div><div class="chips" id="modelChips" style="margin-top:6px"></div></div>`}
function initModelMulti(){const btn=document.getElementById('modelMultiBtn'),panel=document.getElementById('modelPanel'),chips=document.getElementById('modelChips');const update=()=>{const vals=[...panel.querySelectorAll('input:checked')].map(x=>x.value);chips.innerHTML=vals.map(v=>`<span class="chip">${esc(v)}</span>`).join('');btn.textContent=vals.length?`${vals.length} modello/i selezionato/i`:'Seleziona modelli…'};btn.onclick=()=>panel.classList.toggle('show');panel.querySelectorAll('input').forEach(i=>i.onchange=update);update();return ()=>[...panel.querySelectorAll('input:checked')].map(x=>x.value)}
function partsEditor(id,qty){return `<div id="${id}"></div><button type="button" class="btn btn-soft btn-sm" data-add-parts="${id}" data-qty="${qty?1:0}">+ Aggiungi ricambio</button>`}
function addPartRow(containerId,qty,p={}){const d=document.createElement('div');d.className='inline-row'+(qty?' qty':'');d.innerHTML=`<input placeholder="Part Number" class="pn" value="${esc(p.pn||'')}"><input placeholder="Descrizione" class="desc" value="${esc(p.desc||'')}">${qty?`<input type="number" min="1" placeholder="Q.tà" class="qtyv" value="${esc(p.qty||1)}">`:''}<button type="button" class="btn btn-danger btn-sm">×</button>`;d.querySelector('button').onclick=()=>d.remove();document.getElementById(containerId).appendChild(d)}
function collectParts(id,qty){return [...document.getElementById(id).children].map(r=>({pn:r.querySelector('.pn').value.trim(),desc:r.querySelector('.desc').value.trim(),...(qty?{qty:Number(r.querySelector('.qtyv').value)||1}:{})})).filter(p=>p.pn||p.desc)}
async function filesToData(fileList){const files=[...fileList];return Promise.all(files.map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res({id:crypto.randomUUID(),name:f.name,type:f.type||'application/octet-stream',size:f.size,dataUrl:r.result});r.onerror=()=>res({id:crypto.randomUUID(),name:f.name,type:f.type||'application/octet-stream',size:f.size,dataUrl:null});r.readAsDataURL(f)})))}
function openNewCase(){const body=`<div class="form-grid"><div class="field"><label class="required">Scheda</label><input id="fSheet" placeholder="es. 306"></div><div class="field"><label class="required">Data apertura</label><input type="date" id="fDate" value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label class="required">ANOMALIA</label><input id="fTitle" placeholder="Titolo sintetico dell'anomalia"></div><div class="field full"><label class="required">Descrizione</label><textarea id="fDesc"></textarea></div><div class="field"><label class="required">Modelli coinvolti</label>${modelMultiHtml([])}</div><div class="field"><label class="required">Ente</label><select id="fEntity"><option value="">Seleziona…</option>${ENTITIES.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Categoria</label><select id="fCategory"><option value="">Seleziona…</option>${CATEGORIES.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Stato</label><select id="fStatus"><option value="open">Aperto</option><option value="suspended">Sospeso</option></select></div></div><div class="form-section"><div class="form-title">Ricambi ANOMALIA <span class="hint">(facoltativi)</span></div>${partsEditor('newParts',false)}</div><div class="form-section"><div class="form-title">Allegati ANOMALIA</div><input type="file" id="fFiles" multiple><div class="hint">Immagini, PDF, Excel, Word, PowerPoint e altri file tecnici.</div></div><div class="form-section"><div class="form-title">Scoring</div><div class="form-grid"><div class="field"><label class="required">Numero casi / frequenza</label><input type="number" min="0" id="fFreq" value="0"></div><div class="field"><label class="required">Sicurezza (1-10)</label><input type="number" min="1" max="10" id="fSafety" value="1"></div><div class="field"><label class="required">Sales deterrent (1-10)</label><input type="number" min="1" max="10" id="fSales" value="1"></div><div class="field"><label class="required">Costi garanzia (€)</label><input type="number" min="0" step="0.01" id="fWarranty" value="0"></div><div class="field"><label class="required">Urgenza (1-10)</label><input type="number" min="1" max="10" id="fUrgency" value="1"></div><div class="field"><label>Bonus manuale</label><input type="number" min="0" max="50" id="fBonus" value="0"></div><div class="field full"><label>Motivazione bonus</label><input id="fBonusReason"></div></div></div>`;openModal('Nuovo caso',body,async close=>{const getModels=window.__getModels;const models=getModels();const required=[['fSheet','Scheda'],['fTitle','ANOMALIA'],['fDesc','Descrizione'],['fEntity','Ente']];for(const [id,n] of required){if(!document.getElementById(id).value.trim()){alert(`Compila il campo ${n}.`);return}}if(!models.length){alert('Seleziona almeno un modello coinvolto.');return}const atts=await filesToData(document.getElementById('fFiles').files);state.cases.push({id:crypto.randomUUID(),sheet:document.getElementById('fSheet').value.trim(),title:document.getElementById('fTitle').value.trim(),status:document.getElementById('fStatus').value,date:document.getElementById('fDate').value,models,entity:document.getElementById('fEntity').value,category:document.getElementById('fCategory').value,description:document.getElementById('fDesc').value.trim(),parts:collectParts('newParts',false),attachments:atts,frequencyCases:Number(document.getElementById('fFreq').value),safety:Number(document.getElementById('fSafety').value),sales:Number(document.getElementById('fSales').value),warrantyCost:Number(document.getElementById('fWarranty').value),urgency:Number(document.getElementById('fUrgency').value),bonus:Number(document.getElementById('fBonus').value),bonusReason:document.getElementById('fBonusReason').value.trim(),currentAction:{text:'',owner:'',due:'',status:'Aperta'},solution:{text:'',parts:[],attachments:[]},updates:[],deletedAt:null});save();close();render();toast('Nuovo caso creato')});window.__getModels=initModelMulti();document.querySelector('[data-add-parts="newParts"]').onclick=()=>addPartRow('newParts',false)}
function openUpdate(c){const body=`<div class="form-grid"><div class="field"><label>Data riunione</label><input type="date" id="uDate" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Stato caso</label><select id="uCaseStatus"><option value="open" ${c.status==='open'?'selected':''}>Aperto</option><option value="suspended" ${c.status==='suspended'?'selected':''}>Sospeso</option><option value="closed" ${c.status==='closed'?'selected':''}>Risolto</option></select></div><div class="field full"><label class="required">Aggiornamento</label><textarea id="uText" placeholder="Cosa è emerso / cosa è stato deciso"></textarea></div><div class="field full"><label>Azione corrente</label><input id="uAction" value="${esc(c.currentAction?.text||'')}"></div><div class="field"><label>Responsabile</label><select id="uOwner"><option value="">—</option>${ENTITIES.map(x=>`<option ${x===c.currentAction?.owner?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Scadenza</label><input type="date" id="uDue" value="${esc(c.currentAction?.due||'')}"></div><div class="field"><label>Stato azione</label><select id="uActionStatus"><option>Aperta</option><option>In attesa</option><option>Completata</option><option>Chiusa</option></select></div></div><div class="form-section"><div class="form-title">Ricambi discussi / richiesti</div>${partsEditor('updateParts',true)}</div><div class="form-section"><div class="form-title">Allegati aggiornamento</div><input type="file" id="uFiles" multiple></div>`;openModal('Aggiorna riunione',body,async close=>{const txt=document.getElementById('uText').value.trim();if(!txt){alert('Inserisci un aggiornamento prima di salvare.');return}const atts=await filesToData(document.getElementById('uFiles').files);const u={id:crypto.randomUUID(),date:document.getElementById('uDate').value,text:txt,action:document.getElementById('uAction').value.trim(),owner:document.getElementById('uOwner').value,due:document.getElementById('uDue').value,status:document.getElementById('uActionStatus').value,parts:collectParts('updateParts',true),attachments:atts};c.updates.push(u);c.status=document.getElementById('uCaseStatus').value;c.currentAction={text:u.action,owner:u.owner,due:u.due,status:u.status};save();close();renderCase(c.id);toast('Aggiornamento salvato')});document.querySelector('[data-add-parts="updateParts"]').onclick=()=>addPartRow('updateParts',true)}
function openSolution(c){const body=`<div class="form-grid"><div class="field full"><label>Descrizione soluzione</label><textarea id="sText">${esc(c.solution?.text||'')}</textarea></div></div><div class="form-section"><div class="form-title">Ricambi SOLUZIONE</div>${partsEditor('solutionParts',true)}</div><div class="form-section"><div class="form-title">Allegati SOLUZIONE</div><input type="file" id="sFiles" multiple><div class="hint">Gli allegati esistenti non vengono rimossi; puoi eliminarli direttamente dalla scheda.</div></div>`;openModal('Modifica soluzione',body,async close=>{const newAtt=await filesToData(document.getElementById('sFiles').files);c.solution=c.solution||{text:'',parts:[],attachments:[]};c.solution.text=document.getElementById('sText').value.trim();c.solution.parts=collectParts('solutionParts',true);c.solution.attachments=[...(c.solution.attachments||[]),...newAtt];save();close();renderCase(c.id);toast('Soluzione aggiornata')});(c.solution?.parts||[]).forEach(p=>addPartRow('solutionParts',true,p));document.querySelector('[data-add-parts="solutionParts"]').onclick=()=>addPartRow('solutionParts',true)}

document.querySelectorAll('.nav-item').forEach(n=>n.onclick=()=>setView(n.dataset.view));document.getElementById('newCaseTop').onclick=openNewCase;refreshCounts();render();
})();
</script>
</body>
