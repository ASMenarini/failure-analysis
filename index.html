/* Mobile navigation drawer — solo smartphone */
.mobile-menu-btn{display:none}
.mobile-nav-backdrop{display:none}

/* MOBILE ONLY — desktop invariato */
@media(max-width:700px){
.main{padding:14px 12px}
  .topbar{padding:0 12px;gap:10px}
  .brand{gap:9px}
  .brand-badge{font-size:19px;letter-spacing:.45px}
  .top-actions{gap:7px;align-items:center}
  .top-actions .btn{padding:9px 11px;font-size:12px}
  .mobile-menu-btn{display:inline-grid;place-items:center;width:42px;height:42px;padding:0;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:23px;line-height:1}
  .mobile-menu-btn:active{transform:scale(.97)}
  .sidebar{display:block;position:fixed;z-index:120;top:64px;left:0;bottom:0;width:min(300px,86vw);padding:18px 12px;background:#eef1f4;box-shadow:12px 0 30px rgba(15,23,42,.18);transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto}
  .sidebar.mobile-open{transform:translateX(0)}
  .mobile-nav-backdrop{display:block;position:fixed;z-index:110;inset:64px 0 0;background:rgba(15,23,42,.38);opacity:0;pointer-events:none;transition:opacity .22s ease}
  .mobile-nav-backdrop.show{opacity:1;pointer-events:auto}
  body.mobile-nav-open{overflow:hidden}
  .sidebar .nav-item{min-height:48px;font-size:14px;margin-bottom:6px}

.page-head{gap:12px;margin-bottom:14px}
.page-title{font-size:22px}
.sub{font-size:13px}
.topbar{height:64px}
.shell{min-height:calc(100vh - 64px)}
.kpis{grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:12px}
.kpi strong{font-size:22px}
.toolbar{padding:10px;gap:8px}
.toolbar input,.toolbar select{width:100%;min-width:0}

/* Tabella -> card mobile, senza toccare desktop */
.table-card{background:transparent;border:0;overflow:visible}
.table{display:block;width:100%}
.table thead{display:none}
.table tbody{display:block}
.table tbody tr{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px 10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:12px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.table tbody tr:hover{background:#fff}
.table tbody td{display:block;border:0;padding:0;font-size:13px}
.table tbody td:nth-child(1){grid-column:1;grid-row:1}
.table tbody td:nth-child(2){grid-column:2;grid-row:1;font-size:12px;color:var(--muted)}
.table tbody td:nth-child(3){grid-column:4;grid-row:1}
.table tbody td:nth-child(4){grid-column:3;grid-row:1;font-weight:800;color:var(--blue)}
.table tbody td:nth-child(5){grid-column:1;grid-row:2/4;align-self:start}
.table tbody td:nth-child(6){grid-column:2/-1;grid-row:2;font-weight:800;font-size:15px;line-height:1.3;padding-top:2px}
.table tbody td:nth-child(8){grid-column:4;grid-row:3;justify-self:end}
.table tbody td:nth-child(7){grid-column:2/-1;grid-row:4;background:#f8fafc;border-radius:8px;padding:9px 10px;line-height:1.35;color:#334155}
.table tbody td:nth-child(7)::before{content:'Descrizione';display:block;font-size:10px;font-weight:800;letter-spacing:.35px;text-transform:uppercase;color:#7a8794;margin-bottom:3px}
.priority-rank{font-size:14px}
.score-pill{min-width:38px;padding:4px 8px}
.agenda-toggle{width:20px;height:20px}

/* Scheda caso mobile */
.case-navbar{justify-content:space-between}.case-navbar .btn{flex:1 1 auto}.case-nav-position{order:3;width:100%}
.case-cover-card{grid-template-columns:1fr}.case-cover-image{height:240px}.case-cover-empty{height:190px}
.case-thumb{width:64px;height:48px}.case-thumb-placeholder{width:64px;height:48px}
.case-layout{grid-template-columns:1fr}
.case-side{position:static;order:2}
.case-main{order:1}
.case-header{display:block}
.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 3px 12px rgba(15,23,42,.05)}
.actions .btn{width:100%;padding:9px 8px;font-size:12px}
.actions #deleteCaseBtn{grid-column:1/-1}
.meta-grid{grid-template-columns:1fr 1fr}
.action-row,.timeline-extra{grid-template-columns:1fr}
.attach-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.attachment img,.file-icon{height:120px}
.attachment-tools{flex-wrap:wrap}
.attachment-tools .btn{flex:1 1 auto;text-align:center}
.hover-preview{display:none!important}
.modal-backdrop{padding:16px 10px}
.modal{border-radius:12px}
.modal-body{padding:14px}
.form-grid{grid-template-columns:1fr}
.inline-row,.inline-row.qty{grid-template-columns:1fr}
}

@media(max-width:420px){
.kpis{grid-template-columns:1fr}
.meta-grid{grid-template-columns:1fr}
.attach-grid{grid-template-columns:1fr}
.actions{grid-template-columns:1fr}
.actions #deleteCaseBtn{grid-column:auto}
}



.migration-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.migration-stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.migration-stat strong{display:block;font-size:22px}.migration-stat span{font-size:12px;color:var(--muted)}
.migration-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.migration-row{display:grid;grid-template-columns:1.1fr 1.4fr .8fr;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.migration-row .legacy{font-size:12px;color:#667788;overflow-wrap:anywhere}.migration-row .found{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.migration-badge{display:inline-flex;border-radius:16px;padding:4px 8px;font-size:11px;font-weight:800;white-space:nowrap}
.migration-ok{background:#d1fadf;color:#067647}.migration-missing{background:#fee4e2;color:#b42318}.migration-ambiguous{background:#fff0c2;color:#8a5b00}.migration-live{background:#eaf2f9;color:#0b4f8a}
.migration-progress{height:8px;border-radius:8px;background:#e9eef3;overflow:hidden;margin-top:10px}.migration-progress>div{height:100%;background:var(--blue);width:0;transition:width .15s ease}
@media(max-width:700px){.migration-summary{grid-template-columns:1fr 1fr}.migration-row{grid-template-columns:1fr}.migration-row>div:last-child{justify-self:start}}



.doc-preview{height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#eef2f6;color:#41556a;border-bottom:1px solid var(--line)}
.doc-ext{font-size:22px;font-weight:900;letter-spacing:.7px}
.doc-kind{margin-top:5px;font-size:11px;font-weight:700;text-transform:uppercase;color:#5e748a;text-align:center;padding:0 8px}
.legacy-missing{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfd}.legacy-badge{font-size:20px}.legacy-text{min-width:0;flex:1;color:var(--muted);font-size:12px}.legacy-name{font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.legacy-actions{flex:0 0 auto}
@media(max-width:700px){.doc-preview{height:120px}}


/* v15.2 — visualizzatore interno MSG/EML */
.email-viewer{display:grid;gap:14px}
.email-meta{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px}
.email-meta b{font-size:12px;color:#667788;text-transform:uppercase;letter-spacing:.3px}
.email-body{white-space:pre-wrap;line-height:1.55;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;min-height:140px;max-height:52vh;overflow:auto}
.email-attachments{display:flex;flex-wrap:wrap;gap:7px}
.email-attachment-chip{display:inline-flex;align-items:center;gap:6px;background:#eef4f8;border:1px solid #dce6ee;border-radius:16px;padding:6px 9px;font-size:12px;font-weight:700;color:#405466}
.email-loading{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:700px){.email-meta{grid-template-columns:1fr;gap:4px}.email-meta b{margin-top:6px}}

/* v15.3 — allegati interni MSG + navigazione schede sempre visibile */
.case-navbar{
  position:sticky;
  top:84px;
  z-index:45;
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:12px;
  padding:8px 10px;
  box-shadow:0 6px 18px rgba(15,23,42,.08);
  backdrop-filter:blur(8px);
}
.email-attachments{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.email-attachment-card{border:1px solid var(--line);border-radius:10px;background:#fafbfd;overflow:hidden;min-width:0}
.email-attachment-preview{height:118px;display:grid;place-items:center;background:#eef2f6;color:#475467;font-weight:900;letter-spacing:.5px;overflow:hidden}
.email-attachment-preview img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.email-attachment-info{padding:10px}
.email-attachment-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#334155}
.email-attachment-meta{font-size:11px;color:var(--muted);margin-top:3px}
.email-attachment-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.email-attachment-tools .btn{padding:6px 9px;font-size:11px}
@media(max-width:700px){
  .case-navbar{top:72px}
  .email-attachments{grid-template-columns:1fr}
}



/* v16.4.1 — barra azioni scheda più compatta su desktop; nessun'altra modifica */
@media(min-width:901px){
  .case-actionbar{
    width:690px;
    max-width:690px;
    flex:0 0 690px;
    align-content:flex-start;
  }
  .page-head > div:first-child{min-width:0;flex:1 1 auto}
}


/* v16.4.3 — correzioni mirate: rimozione riferimenti storici, link compatti, titolo nella barra sticky */
.case-nav-title{min-width:0;flex:1 1 auto;padding:0 12px;text-align:center;color:#17324d}
.case-nav-title .case-nav-sheet{display:block;font-size:10px;line-height:1.15;font-weight:800;letter-spacing:.45px;text-transform:uppercase;color:#718096}
.case-nav-title .case-nav-name{display:block;margin-top:2px;font-size:13px;line-height:1.25;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.external-attachment .attachment-tools .btn{font-size:11px;line-height:1.15;white-space:normal;overflow-wrap:anywhere;padding:6px 4px}
.external-attachment .attachment-name{max-width:100%}
@media(max-width:700px){.case-navbar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 8px;align-items:center}.case-navbar > div:last-child{grid-column:1/-1;margin-left:0!important;justify-content:center}.case-nav-title{text-align:left;padding:0 4px}.case-nav-title .case-nav-name{font-size:12px}}


/* v16.4.5 — SOLO veste grafica sezione SOLUZIONE */
.solution-card{
  position:relative;
  overflow:hidden;
  border:1px solid #b9d5ea;
  border-left:6px solid #16a363;
  background:linear-gradient(180deg,#fbfdff 0%,#f5faff 100%);
  box-shadow:0 6px 18px rgba(15,78,138,.06);
}
.solution-card::before{
  content:'';
  position:absolute;
  left:0;right:0;top:0;
  height:3px;
  background:linear-gradient(90deg,#16a363 0%,#0b4f8a 55%,rgba(11,79,138,0) 100%);
}
.solution-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.solution-title-wrap{display:flex;align-items:center;gap:11px;min-width:0}
.solution-icon{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;background:#e5f7ed;color:#0d8a50;font-size:24px;font-weight:900;border:1px solid #bde7ce}
.solution-card .solution-main-title{margin:0;color:#0b4f8a;font-size:22px;line-height:1.1;font-weight:900;letter-spacing:.15px}
.solution-subtitle{margin-top:3px;color:#657586;font-size:12px;font-weight:600}
.solution-valid-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:9px;background:#e8f8ef;border:1px solid #c7ead5;color:#087a46;font-size:12px;font-weight:800;white-space:nowrap}
.solution-description{background:#edf7ff;border:1px solid #c8e1f5;border-left:4px solid #1784d1;border-radius:10px;padding:13px 15px;margin-bottom:14px}
.solution-description-label{display:flex;align-items:center;gap:7px;color:#0b4f8a;font-size:13px;font-weight:800;margin-bottom:6px}
.solution-description .case-body-text{margin:0;font-size:14px;line-height:1.55}
.solution-empty{padding:14px 15px;border:1px dashed #cbd7e2;border-radius:10px;background:rgba(255,255,255,.72);color:#667788;margin-bottom:14px}
.solution-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.solution-meta{background:#fff;border:1px solid #cfe0ee;border-radius:10px;padding:12px 14px;min-height:66px;display:flex;align-items:center;gap:10px}
.solution-meta-icon{width:32px;height:32px;border-radius:8px;background:#edf5fb;color:#0b4f8a;display:grid;place-items:center;font-size:16px;flex:0 0 32px}
.solution-meta b{display:block;color:#667788;font-size:10px;text-transform:uppercase;letter-spacing:.45px;margin-bottom:3px}
.solution-meta-value{font-size:15px;font-weight:800;color:#16324a;word-break:break-word}
.solution-card .parts-table{margin-top:7px;background:#fff;border:1px solid #d6e4ef;border-radius:9px;overflow:hidden}
.solution-card .parts-table th{background:#eaf4fb;color:#234863;font-weight:800}
.solution-card .parts-table td,.solution-card .parts-table th{padding:9px 10px}
.solution-parts-wrap{margin-top:14px;padding:12px 13px;background:rgba(255,255,255,.65);border:1px solid #d9e7f1;border-radius:10px}
.solution-parts-title,.solution-attachments-title{display:flex;align-items:center;gap:7px;color:#123e64;font-weight:800}
.solution-attachments{margin-top:14px;padding:12px 13px;background:rgba(255,255,255,.65);border:1px solid #d9e7f1;border-radius:10px}
@media(max-width:700px){
  .solution-card{border-left-width:4px}
  .solution-card .solution-main-title{font-size:19px}
  .solution-icon{width:38px;height:38px;flex-basis:38px;font-size:21px}
  .solution-meta-grid{grid-template-columns:1fr}
}




.case-detail-shell{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.case-detail-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.case-detail-rail{display:flex;flex-direction:column;gap:14px;min-width:0;position:sticky;top:138px;align-self:start}
.case-detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:22px;margin-bottom:14px}
.case-detail-heading{min-width:0;flex:1}
.case-detail-heading .page-title{font-size:30px;line-height:1.12;margin:4px 0 8px}
.case-quickline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#607183;font-size:13px;font-weight:650}
.case-quickline .dot{color:#a3b0bc;font-weight:900}
.case-quickline .status{font-size:11px;padding:4px 8px}
.case-detail-header .case-actionbar{flex:0 1 700px;justify-content:flex-start}

/* Copertina: grande, senza intestazione ridondante */
.case-hero-card{padding:0;overflow:hidden}
.case-hero-card .case-cover-media{height:360px;border-radius:0;background:#eef3f7}
.case-hero-card .case-cover-image{height:100%;width:100%;object-fit:cover;border-radius:0}
.case-hero-card .case-cover-empty{height:360px;border:0;border-radius:0}
.case-hero-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.case-hero-footer .case-cover-tools{margin:0;display:flex;gap:7px;flex-wrap:wrap}
.case-hero-note{font-size:11px;color:#7a8794;text-align:right}
.case-cover-drop-compact .drop-zone{margin-top:0;border-radius:0;border-left:0;border-right:0;border-bottom:0;background:#fafcfe;padding:11px}

/* Anomalia: meno box, più gerarchia */
.anomaly-card{padding:18px 18px 16px}
.anomaly-title-row{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.anomaly-title-icon{width:30px;height:30px;border-radius:8px;background:#edf5fb;color:var(--blue);display:grid;place-items:center;font-weight:900}
.anomaly-title-row .section-title{margin:0;color:#0b4f8a;font-size:16px!important}
.anomaly-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-bottom:16px;border-top:1px solid #edf1f5;border-bottom:1px solid #edf1f5}
.anomaly-summary-item{padding:10px 12px;border-right:1px solid #edf1f5;min-width:0}
.anomaly-summary-item:last-child{border-right:0}
.anomaly-summary-item b{display:block;color:#738191;font-size:10px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.anomaly-summary-item strong,.anomaly-summary-item span:not(.status){font-size:13px;color:#1e3346;word-break:break-word}
.anomaly-description-label{font-size:11px;font-weight:800;color:#667788;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.anomaly-card .case-body-text{margin:0 0 10px;font-size:14px;line-height:1.58}

/* Azione corrente: elemento operativo protagonista */
.current-action.case-current-action{border:1px solid #c8e1f5;border-left:5px solid #1683cf;background:linear-gradient(135deg,#f7fbff,#edf7ff);padding:17px 18px}
.case-current-action .current-action-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.case-current-action .current-action-icon{width:30px;height:30px;border-radius:50%;background:#1683cf;color:white;display:grid;place-items:center;font-size:13px;font-weight:900}
.case-current-action .section-title{margin:0;color:#0b4f8a;font-size:16px!important}
.case-current-action .action-main-text{background:rgba(255,255,255,.82);border:1px solid #d6e8f5;border-radius:9px;padding:12px 13px;font-size:15px!important;line-height:1.48}
.case-current-action .action-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:12px;background:#fff;border:1px solid #dbe8f2;border-radius:9px;overflow:hidden}
.case-current-action .action-row>div{padding:10px 12px;border-right:1px solid #e7eef4}
.case-current-action .action-row>div:last-child{border-right:0}

/* Rail allegati */
.case-attachments-rail{padding:14px}
.case-attachments-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.case-attachments-head h3{margin:0;color:#0b4f8a;font-size:15px}
.case-attachments-group{border-top:1px solid #edf1f5;padding-top:11px;margin-top:11px}
.case-attachments-group:first-of-type{border-top:0;padding-top:0;margin-top:0}
.case-attachments-group-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:11px;font-weight:850;color:#536273;text-transform:uppercase;letter-spacing:.35px}
.case-attachments-rail .attach-grid{grid-template-columns:1fr;gap:8px}
.case-attachments-rail .attachment{display:grid;grid-template-columns:82px minmax(0,1fr);min-height:82px}
.case-attachments-rail .attachment-media,.case-attachments-rail .file-icon{height:82px;min-height:82px}
.case-attachments-rail .attachment img{height:82px}
.case-attachments-rail .file-icon{font-size:18px}
.case-attachments-rail .attachment-body{padding:8px 9px;min-width:0}
.case-attachments-rail .attachment-name{font-size:12px}
.case-attachments-rail .attachment-tools{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.case-attachments-rail .attachment-tools .btn,.case-attachments-rail .attachment-tools a{font-size:10px!important;padding:6px 5px!important;min-width:0}
.case-attachments-rail .drop-zone{padding:10px 8px;margin-top:8px}
.case-attachments-rail .drop-zone b{font-size:12px}
.case-attachments-rail .drop-zone .hint{font-size:10px}

/* Scoring nel rail, meno dominante */
.case-detail-rail .score-card{box-shadow:none}
.case-detail-rail .score-total{display:flex;align-items:end;justify-content:space-between;text-align:left;padding:2px 0 10px}
.case-detail-rail .score-total strong{font-size:28px}
.case-detail-rail .score-list{gap:5px}

/* Storico: separazione netta fra presente e passato */
.history-divider-title{display:flex;align-items:center;gap:10px;margin:3px 0 0;color:#0b4f8a;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.35px}
.history-divider-title::before{content:'◷';font-size:18px}
.history-card{padding:16px 18px}
.history-card .timeline{gap:9px}
.history-card .timeline-item{padding:12px 13px 12px 16px}
.history-card .timeline-head{margin-bottom:6px}
.history-card .timeline-text{font-size:12.5px!important;line-height:1.45}

/* Soluzione allineata al nuovo layout */
.case-detail-main .solution-card{box-shadow:0 2px 10px rgba(15,23,42,.04)}

@media(max-width:1180px){
  .case-detail-shell{grid-template-columns:minmax(0,1fr) 300px}
  .anomaly-summary{grid-template-columns:repeat(3,minmax(0,1fr))}
  .anomaly-summary-item:nth-child(3){border-right:0}
  .anomaly-summary-item:nth-child(n+4){border-top:1px solid #edf1f5}
}
@media(max-width:900px){

function emailAttachmentExt(name=''){const m=String(name).toLowerCase().match(/\.([a-z0-9]+)$/);return m?m[1]:''}

function extractMsgAttachments(reader,data){

    try{
      const x=reader.getAttachment(meta);
      const name=x?.fileName||meta?.fileName||meta?.fileNameShort||('Allegato '+(i+1));

    }).join('')}</div>`;

function unfoldHeaderLines(text){return String(text||'').replace(/\r?\n[ \t]+/g,' ')}
function parseSimpleEml(text){
  const normalized=String(text||'').replace(/\r\n/g,'\n');
  const cut=normalized.indexOf('\n\n');
  const head=unfoldHeaderLines(cut>=0?normalized.slice(0,cut):normalized);
  const body=cut>=0?normalized.slice(cut+2):'';
  const get=n=>{const m=head.match(new RegExp('^'+n+':\\s*(.*)$','mi'));return m?m[1].trim():''};
  const splitPeople=v=>v?v.split(',').map(x=>({name:x.trim(),recipType:'to'})):[];
  return {subject:get('Subject'),senderName:get('From'),recipients:splitPeople(get('To')),body,messageDeliveryTime:get('Date'),attachments:[]};
}
async function openEmailInline(attId,name='Messaggio.msg'){
  const ui=openEmailViewerModal(name);
  let embedded=[];
  try{
    const r=await fetch(attachmentOpenUrl(attId),{cache:'no-store'});
    if(!r.ok)throw new Error('Errore '+r.status);
    const ext=String(name).split('.').pop().toLowerCase();
    let data;
    if(ext==='eml'){
      data=parseSimpleEml(await r.text());
    }else{
      const buf=await r.arrayBuffer();
      const MsgReader=await loadMsgReaderModule();
      const reader=new MsgReader(buf);
      data=reader.getFileData();
      if(!data||typeof data!=='object')throw new Error('Formato MSG non leggibile');
      embedded=extractMsgAttachments(reader,data);
    }
    if(ui.body){ui.body.innerHTML=renderParsedEmail(data,name,embedded);bindEmbeddedMsgAttachments(ui.body)}
    const oldClose=ui.close;
    ui.close=()=>{embedded.forEach(a=>{if(a.url)try{URL.revokeObjectURL(a.url)}catch{}});oldClose()};
    const closeBtn=document.getElementById('emailViewerClose'),xBtn=document.getElementById('emailViewerX'),bd=document.getElementById('modalBackdrop');
    if(closeBtn)closeBtn.onclick=ui.close;if(xBtn)xBtn.onclick=ui.close;if(bd)bd.onclick=e=>{if(e.target===bd)ui.close()};
  }catch(e){
    embedded.forEach(a=>{if(a.url)try{URL.revokeObjectURL(a.url)}catch{}});
    if(ui.body)ui.body.innerHTML=`<div class="card danger-zone"><h3 class="section-title">Impossibile visualizzare il messaggio</h3><div>${esc(e.message||String(e))}</div><div class="muted" style="margin-top:8px">Il file originale resta disponibile con il pulsante Scarica.</div></div>`;
  }
}

function attachmentFileKind(a){const n=String(a?.name||'').toLowerCase(),t=String(a?.type||'').toLowerCase();if(isImageAttachment(a))return 'IMMAGINE';if(t==='application/pdf'||/\.pdf$/i.test(n))return 'PDF';if(/\.msg$/i.test(n)||t==='application/vnd.ms-outlook')return 'MSG';if(/\.pptx?$/i.test(n)||t.includes('presentation'))return /\.ppt$/i.test(n)?'PPT':'PPTX';if(/\.xlsx?$/i.test(n)||t.includes('spreadsheet')||t.includes('excel'))return /\.xls$/i.test(n)?'XLS':'XLSX';if(/\.docx?$/i.test(n)||t.includes('wordprocessing')||t.includes('msword'))return /\.doc$/i.test(n)?'DOC':'DOCX';return (n.split('.').pop()||'FILE').toUpperCase()}

function openLightbox(images,startId){const list=(images||[]).filter(a=>isImageAttachment(a)&&a.dataUrl);if(!list.length){alert('Immagine non disponibile per lo zoom.');return}let idx=list.findIndex(a=>String(a.id)===String(startId));if(idx<0)idx=0;lightboxState={images:list,index:idx,zoom:1};const box=ensureLightbox();box.classList.add('show');document.body.style.overflow='hidden';updateLightbox()}

function isCriticalCase(c){return total(c)>=60}
function isAgedCase(c){return ageScoreForCase(c)>=12}
function dueStatus(due,status){
  const s=String(status||'').trim().toLowerCase();
  if(['completata','completato','chiusa','chiuso','closed','done'].includes(s))return {kind:'done',label:'Completata'};
  if(!due)return {kind:'none',label:''};
  const today=localDateISO();
  if(due<today)return {kind:'overdue',label:'Scaduta'};
  const a=new Date(today+'T12:00:00'),b=new Date(due+'T12:00:00');
  const days=Math.ceil((b-a)/86400000);
  if(days<=7)return {kind:'soon',label:days===0?'Oggi':days===1?'Domani':`Tra ${days} gg`};
  return {kind:'ok',label:''};
}
function dueBadgeHtml(due,status){const d=dueStatus(due,status);return d.kind==='none'||(!d.label&&d.kind==='ok')?'':`<span class="v18-due v18-due-${d.kind}">${esc(d.label)}</span>`}

async function pptImageData(src){
  if(!src)return null;
  const v=String(src);
  if(v.startsWith('data:'))return v;
  try{
    const res=await fetch(v,{mode:'cors'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const blob=await res.blob();
    return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Lettura immagine fallita'));r.readAsDataURL(blob)});
  }catch(e){console.warn('Immagine PPTX non caricabile:',v,e);return null}
}

function attachmentLooksImage(a){const n=String(a?.name||a?.file_name||'').toLowerCase(),t=String(a?.type||a?.mime_type||'').toLowerCase();return t.startsWith('image/')||/\.(png|jpe?g|jfif|bmp|gif|webp|tiff?)$/i.test(n)}
const PPT_IMG_CACHE=new Map();
async function imageDataForPpt(a){
 if(!a||!attachmentLooksImage(a))return null;
 const key=String(a.id||a.dataUrl||a.name||Math.random()); if(PPT_IMG_CACHE.has(key))return PPT_IMG_CACHE.get(key);
 const src=a.dataUrl||a.public_url||a.url||''; if(!src)return null;
 const p=(async()=>{try{if(/^data:image\//i.test(src))return src;const res=await fetch(src,{cache:'no-store'});if(!res.ok)return null;const blob=await res.blob();if(!String(blob.type||'').startsWith('image/')&&!attachmentLooksImage(a))return null;return await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve(null);r.readAsDataURL(blob)});}catch(e){console.warn('Immagine PPT non leggibile',a?.name,e);return null}})();
 PPT_IMG_CACHE.set(key,p);return p;
}
async function buildCaseImagesForPpt(c){

 (c.attachments||[]).forEach(a=>push(a,'ANOMALIA','',c.date,1));
 (c.updates||[]).forEach(u=>(u.attachments||[]).forEach(a=>push(a,'RIUNIONE',u.text||'',u.date,2)));
 (c.solution?.attachments||[]).forEach(a=>push(a,'SOLUZIONE','',c.solution?.date||'',3));
 const seen=new Set(),items=[];for(const x of raw){const k=x.id||`${x.section}|${x.date}|${x.name}`;if(seen.has(k))continue;seen.add(k);const dataUrl=await imageDataForPpt(x.att);if(dataUrl)items.push({...x,dataUrl});}
 let cover=null;if(c.coverAttachmentId)cover=items.find(x=>x.id&&x.id===String(c.coverAttachmentId));if(!cover)cover=items.find(x=>x.section==='ANOMALIA')||items[0]||null;
 const gallery=items.filter(x=>!cover||x.id!==cover.id||!x.id).filter((x,i,arr)=>!cover || x!==cover);
 return {cover,gallery,all:items};

function historyPagesForPpt(c){
 const hist=(c.updates||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
 const pages=[];let page=[];let used=0;
 for(const u of hist){const len=pptText(u.text).length;let units=1.0+Math.ceil(len/310)*.55+(u.action?.trim()?0.35:0);if(len>760)units=5.2;if(used+units>5.0&&page.length){pages.push(page);page=[];used=0}page.push({...u,__units:units});used+=units;if(len>760){pages.push(page);page=[];used=0}}
 if(page.length)pages.push(page);return pages;
}

let legacySourceFiles=[];
let legacyMatches=[];

function decodeLegacyText(v=''){
  let s=String(v??'').normalize('NFKC').trim();
  try{s=decodeURIComponent(s)}catch{}
  return s;
}
function normalizeLegacyPath(v=''){
  return decodeLegacyText(v)
    .replace(/\\/g,'/')
    .replace(/\/+/g,'/')
    .replace(/^file:\/\//i,'')
    .replace(/^#+|#+$/g,'')
    .trim()
    .toLowerCase();
}
function cleanFileName(v=''){
  return decodeLegacyText(v)
    .replace(/^#+|#+$/g,'')
    .replace(/[?#].*$/,'')
    .trim()
    .toLowerCase();
}
function baseName(v=''){
  const p=normalizeLegacyPath(v).split('/');
  return cleanFileName(p[p.length-1]||'');
}
function legacyPathVariants(v=''){
  const raw=decodeLegacyText(v);
  const parts=raw.split('#').map(x=>x.trim()).filter(Boolean);
  const source=parts.length?parts:[raw];
  const out=[];
  for(const part of source){
    const norm=normalizeLegacyPath(part);
    if(norm&&!out.includes(norm))out.push(norm);
  }
  return out;
}
function legacyFileNames(v=''){
  const out=[];
  for(const part of legacyPathVariants(v)){
    const n=baseName(part);
    if(n&&!out.includes(n))out.push(n);
  }
  const direct=baseName(v);
  if(direct&&!out.includes(direct))out.push(direct);
  return out;
}
function suffixScore(a,b){
  const aa=normalizeLegacyPath(a).split('/').filter(Boolean),bb=normalizeLegacyPath(b).split('/').filter(Boolean);
  let i=aa.length-1,j=bb.length-1,n=0;
  while(i>=0&&j>=0&&aa[i]===bb[j]){n++;i--;j--}
  return n;
}
function bestLegacySuffixScore(legacyPath,relativePath){
  const variants=legacyPathVariants(legacyPath);
  return variants.reduce((best,v)=>Math.max(best,suffixScore(v,relativePath)),0);
}
function collectLegacyAttachments(){
  const out=[];
  for(const c of state.cases||[]){
    const push=(a,where)=>{if(a?.legacyPath)out.push({attachment:a,caseId:c.id,sheet:c.sheet,title:c.title,where})};
    (c.attachments||[]).forEach(a=>push(a,'ANOMALIA'));
    (c.solution?.attachments||[]).forEach(a=>push(a,'SOLUZIONE'));
    (c.updates||[]).forEach(u=>(u.attachments||[]).forEach(a=>push(a,`RIUNIONE ${fmtDate(u.date)}`)));
  }
  return out;
}
function analyzeLegacyFolder(files){
  legacySourceFiles=Array.from(files||[]);
  const indexed=legacySourceFiles.map((file,i)=>({
    file,i,
    rel:file.webkitRelativePath||file.name,
    name:cleanFileName(file.name),
    relNorm:normalizeLegacyPath(file.webkitRelativePath||file.name)
  }));
  const refs=collectLegacyAttachments();
  legacyMatches=refs.map(ref=>{
    const a=ref.attachment;
    if(a.live||a.storageKey)return {...ref,status:'live',file:null,reason:'Già migrato'};

    const names=legacyFileNames(a.legacyPath||a.name);
    let candidates=indexed.filter(x=>names.includes(x.name));
    if(!candidates.length){
      return {...ref,status:'missing',file:null,reason:`File non trovato${names.length?' · cercato: '+names.join(' / '):''}`};
    }
    if(candidates.length===1){
      const x=candidates[0];
      if(x.file.size>15*1024*1024)return {...ref,status:'missing',file:null,reason:'File oltre 15 MB'};
      return {...ref,status:'ok',file:x.file,relativePath:x.rel,reason:'Nome file univoco (formato Access normalizzato)'};
    }

    const ranked=candidates
      .map(x=>({...x,score:bestLegacySuffixScore(a.legacyPath,x.rel)}))
      .sort((x,y)=>y.score-x.score||x.rel.localeCompare(y.rel));
    if(ranked[0].score>ranked[1].score && ranked[0].score>=2){
      const x=ranked[0];
      if(x.file.size>15*1024*1024)return {...ref,status:'missing',file:null,reason:'File oltre 15 MB'};
      return {...ref,status:'ok',file:x.file,relativePath:x.rel,reason:'Percorso storico compatibile'};
    }
    return {...ref,status:'ambiguous',file:null,reason:`${candidates.length} file con lo stesso nome`};
  });
  renderMigration();
}

  const input=document.getElementById('legacyFolderInput');

async function migrateCertainLegacyFiles(){
  const jobs=legacyMatches.filter(x=>x.status==='ok'&&x.file);
  if(!jobs.length)return;
  if(!confirm(`Migrare ${jobs.length} allegati storici nello storage? I riferimenti D1 esistenti verranno mantenuti e collegati ai file caricati.`))return;
  const btn=document.getElementById('migrateCertainBtn'),wrap=document.getElementById('migrationProgressWrap'),bar=document.getElementById('migrationProgressBar'),text=document.getElementById('migrationProgressText');
  if(btn)btn.disabled=true;if(wrap)wrap.style.display='block';
  const affected=new Set();let done=0,errors=[];
  for(const job of jobs){
    try{
      const fd=new FormData();fd.append('file',job.file,job.file.name);
      await api('/api/attachments/'+encodeURIComponent(job.attachment.id)+'/migrate',{method:'POST',body:fd});

    }catch(e){job.status='missing';job.reason='Errore: '+e.message;errors.push(`${job.attachment.name}: ${e.message}`)}
    done++;const pct=Math.round(done/jobs.length*100);if(bar)bar.style.width=pct+'%';if(text)text.textContent=`${done}/${jobs.length} elaborati`;
  }

  if(errors.length)alert(`Migrazione completata con ${errors.length} errore/i. Gli allegati riusciti sono già disponibili.\n\n`+errors.slice(0,8).join('\n'));

}
